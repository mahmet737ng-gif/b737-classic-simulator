<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B737 Classic — True 3D Toggle Motion Lab</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#101620;color:#e9eef6}
body{display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,32px)}
main{width:min(780px,100%);border:1px solid #34404e;border-radius:20px;overflow:hidden;background:#18222d;box-shadow:0 25px 65px #0008}
header{padding:19px 24px 12px;display:flex;gap:14px;justify-content:space-between;align-items:center}
h1{font-size:18px;line-height:1.3;margin:0;font-weight:650;letter-spacing:.02em}
small{color:#9cacc0;display:block;margin-top:6px}
.flag{font-size:11px;font-weight:700;letter-spacing:.1em;background:#273c50;padding:8px 11px;border-radius:999px;color:#9cdbff;white-space:nowrap}
.stage{position:relative;background:radial-gradient(ellipse at 50% 46%,#1a2734 0%,#0e151e 70%);min-height:420px;touch-action:none;display:flex;align-items:center;justify-content:center}
.stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:36px 36px;opacity:.12}
#switch{width:min(100%,680px);max-height:480px;display:block;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#switch:active{cursor:grabbing}
#switch text{user-select:none}
.legend{position:absolute;top:16px;left:18px;font-size:12px;color:#b6c4d4;letter-spacing:.05em;pointer-events:none}
.legend strong{color:#f8fafd}
.controls{padding:16px 20px 20px}
.pad{display:grid;grid-template-columns:repeat(3,74px);grid-template-rows:repeat(3,43px);gap:7px;justify-content:center}
button{background:#263443;color:#e8edf5;border:1px solid #435568;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer;transition:background .15s,border .15s,transform .15s}
button:hover{background:#31455a}
button:focus-visible{outline:2px solid #71caff;outline-offset:2px}
button[aria-pressed=true]{border-color:#73d6ff;background:#165477;color:white}
button:active{transform:scale(.95)}
button[data-pose=up]{grid-area:1/2}
button[data-pose=left]{grid-area:2/1}
button[data-pose=center]{grid-area:2/2}
button[data-pose=right]{grid-area:2/3}
button[data-pose=down]{grid-area:3/2}
.options{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid #334354;margin-top:17px;padding-top:14px;color:#b7c4d4;font-size:13px}
.slider{display:flex;align-items:center;gap:12px}
input[type=range]{accent-color:#82d7ff;width:170px}
.metrics{display:flex;gap:9px;align-items:center}
.metrics b{color:#eaf4ff;font-variant-numeric:tabular-nums}
footer{padding:0 20px 17px;text-align:center;color:#879aad;font-size:11px}
@media(max-width:540px){body{padding:0}main{border-radius:0;border:0;min-height:100vh}.stage{min-height:360px}header{padding:15px}.controls{padding:15px}.flag{display:none}.options{justify-content:center}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>B737 Classic — 3D Toggle</h1><small>Front-facing camera · compact stationary pivot · no surrounding disc</small></div>
  <span class="flag">MOTION PROTOTYPE</span>
</header>
<section class="stage" aria-label="Interactive three-dimensional switch movement test">
  <div class="legend">POSITION <strong id="position">UP</strong></div>
  <svg id="switch" viewBox="0 0 600 440" role="img" aria-label="White-handled metal toggle switch with short compact pivot base">
    <defs>
      <radialGradient id="socketRubber" cx=".38" cy=".26" r=".9">
        <stop offset="0" stop-color="#52585b"/>
        <stop offset=".39" stop-color="#292d30"/>
        <stop offset=".76" stop-color="#101518"/>
        <stop offset="1" stop-color="#010304"/>
      </radialGradient>
      <linearGradient id="mountMetal" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4c4b45"/>
        <stop offset=".2" stop-color="#b9b7ad"/>
        <stop offset=".38" stop-color="#f5f2eb"/>
        <stop offset=".52" stop-color="#8d8b86"/>
        <stop offset=".75" stop-color="#d4d1c8"/>
        <stop offset="1" stop-color="#383b3c"/>
      </linearGradient>
      <linearGradient id="shaftMetal" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#343a3c"/>
        <stop offset=".17" stop-color="#888d8d"/>
        <stop offset=".33" stop-color="#f2f2e9"/>
        <stop offset=".46" stop-color="#bdc2c2"/>
        <stop offset=".65" stop-color="#646d72"/>
        <stop offset=".86" stop-color="#adb0ae"/>
        <stop offset="1" stop-color="#2c3438"/>
      </linearGradient>
      <radialGradient id="ivory" cx=".33" cy=".23" r=".82">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".22" stop-color="#f6f9f8"/>
        <stop offset=".64" stop-color="#e0e6e6"/>
        <stop offset=".88" stop-color="#bfc7c8"/>
        <stop offset="1" stop-color="#869295"/>
      </radialGradient>
      <radialGradient id="ballShade" cx=".5" cy=".5" r=".5">
        <stop offset=".65" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="1" stop-color="#53636c" stop-opacity=".35"/>
      </radialGradient>
    </defs>
    <!-- Mount is a short 26px rubber/metal collar; no big plate or washer. -->
    <g id="mount">
      <ellipse cx="300" cy="272" rx="26" ry="22" fill="#070a0c" opacity=".35"/>
      <ellipse cx="300" cy="265" rx="25" ry="21" fill="url(#socketRubber)" stroke="#626364" stroke-width="1.7"/>
      <ellipse cx="300" cy="260" rx="18.5" ry="16" fill="url(#mountMetal)" stroke="#262c2e" stroke-width="2.5"/>
      <ellipse cx="300" cy="257" rx="12.5" ry="12.5" fill="#12191b"/>
    </g>
    <g id="lever">
      <path id="shaft" fill="url(#shaftMetal)" stroke="#353d41" stroke-width="1.4" stroke-linejoin="round"/>
      <path id="shaftGlint" fill="#ffffff" opacity=".34"/>
      <circle id="handle" cx="300" cy="260" r="41" fill="url(#ivory)" stroke="#9ca9ae" stroke-width="1.15"/>
      <circle id="handleShade" cx="300" cy="260" r="41" fill="url(#ballShade)"/>
      <ellipse id="handleHighlight" cx="282" cy="242" rx="12" ry="9" fill="#fff" opacity=".34"/>
    </g>
  </svg>
</section>
<section class="controls">
  <div class="pad" role="group" aria-label="Select toggle switch direction">
    <button data-pose="up" aria-pressed="true">UP</button>
    <button data-pose="left" aria-pressed="false">LEFT</button>
    <button data-pose="center" aria-pressed="false">CENTER</button>
    <button data-pose="right" aria-pressed="false">RIGHT</button>
    <button data-pose="down" aria-pressed="false">DOWN</button>
  </div>
  <div class="options">
    <label class="slider">Deflection <input id="deflection" type="range" min="25" max="65" value="55" step="1"><b id="degrees">55°</b></label>
    <div class="metrics">Shaft projection: <b id="projection">—</b></div>
  </div>
</section>
<footer>Drag or swipe the switch · Arrow keys select a direction · Changes affect only the lever, never the base.</footer>
</main>
<script>
(() => {
  "use strict";
  const svg=document.getElementById("switch");
  const shaft=document.getElementById("shaft"), glint=document.getElementById("shaftGlint");
  const handle=document.getElementById("handle"), shade=document.getElementById("handleShade"), highlight=document.getElementById("handleHighlight");
  const poseText=document.getElementById("position"), projection=document.getElementById("projection");
  const range=document.getElementById("deflection"), degrees=document.getElementById("degrees");
  const buttons=[...document.querySelectorAll("button[data-pose]")];
  const CX=300,CY=260,L=146,FOCAL=560,BALL_R=35;
  const cardinal={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0],center:[0,0]};
  let selected="up", tilt=55*Math.PI/180;
  let current={x:0,y:-Math.sin(tilt)},target={...current},dragging=false;
  function setPose(name) {
    if(!cardinal[name])return;
    selected=name; const [dx,dy]=cardinal[name],amplitude=Math.sin(tilt);
    target={x:dx*amplitude,y:dy*amplitude};
    poseText.textContent=name.toUpperCase();
    buttons.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pose===name)));
  }
  function projected(pose) {
    const radial=Math.min(.98,Math.hypot(pose.x,pose.y));
    const vz=Math.sqrt(1-radial*radial);
    const scale=FOCAL/(FOCAL-L*vz);
    return {x:CX+L*pose.x*scale,y:CY+L*pose.y*scale,scale,radial};
  }
  function render() {
    const p=projected(current);
    const dx=p.x-CX,dy=p.y-CY,dist=Math.hypot(dx,dy);
    const nx=dist>0.00001?-dy/dist:1, ny=dist>0.00001?dx/dist:0;
    const ballRadius=BALL_R*p.scale;
    const shaftStart=7,shaftEnd=Math.min(dist-2,Math.max(shaftStart,dist-ballRadius*.53));
    if(dist>15){
      const sx=CX+dx*shaftStart/dist,sy=CY+dy*shaftStart/dist;
      const ex=CX+dx*shaftEnd/dist,ey=CY+dy*shaftEnd/dist;
      const a=9,b=10.5*p.scale;
      shaft.setAttribute("d",`M ${sx+nx*a} ${sy+ny*a} L ${ex+nx*b} ${ey+ny*b} L ${ex-nx*b} ${ey-ny*b} L ${sx-nx*a} ${sy-ny*a} Z`);
      glint.setAttribute("d",`M ${sx+nx*2} ${sy+ny*2} L ${ex+nx*2} ${ey+ny*2} L ${ex+nx*4} ${ey+ny*4} L ${sx+nx*4} ${sy+ny*4} Z`);
    } else {shaft.setAttribute("d","");glint.setAttribute("d","");}
    for(const c of [handle,shade]){c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r",ballRadius);}
    highlight.setAttribute("cx",p.x-ballRadius*.32);highlight.setAttribute("cy",p.y-ballRadius*.36);
    highlight.setAttribute("rx",ballRadius*.25);highlight.setAttribute("ry",ballRadius*.18);
    projection.textContent=Math.round(dist)+" px";
  }
  function frame(){
    const damping=.18;
    current.x+=(target.x-current.x)*damping;
    current.y+=(target.y-current.y)*damping;
    if(Math.abs(current.x-target.x)<.0001)current.x=target.x;
    if(Math.abs(current.y-target.y)<.0001)current.y=target.y;
    render();requestAnimationFrame(frame);
  }
  buttons.forEach(b=>b.addEventListener("click",()=>setPose(b.dataset.pose)));
  range.addEventListener("input",()=>{
    tilt=Number(range.value)*Math.PI/180;
    degrees.textContent=range.value+"°";setPose(selected);
  });
  function svgPoint(e){
    const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    const matrix=svg.getScreenCTM();return matrix?p.matrixTransform(matrix.inverse()):{x:CX,y:CY};
  }
  svg.addEventListener("pointerdown",e=>{dragging=true;svg.setPointerCapture(e.pointerId);});
  svg.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const p=svgPoint(e),vx=p.x-CX,vy=p.y-CY;
    const mag=Math.hypot(vx,vy),r=Math.sin(tilt);
    if(mag<16){target={x:0,y:0};return;}
    target={x:vx/mag*r,y:vy/mag*r};
  });
  function release(e){
    if(!dragging)return;dragging=false;
    const p=svgPoint(e),x=p.x-CX,y=p.y-CY;
    if(Math.hypot(x,y)<23)setPose("center");
    else setPose(Math.abs(x)>Math.abs(y)?x<0?"left":"right":y<0?"up":"down");
  }
  svg.addEventListener("pointerup",release);
  svg.addEventListener("pointercancel",release);
  window.addEventListener("keydown",e=>{
    const key={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",Escape:"center"}[e.key];
    if(key){e.preventDefault();setPose(key);}
  });
  frame();
})();
</script>
</body>
</html>
