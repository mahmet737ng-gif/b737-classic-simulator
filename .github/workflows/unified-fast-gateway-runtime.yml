name: Unified fast runtime for authenticated Gateway
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unified-fast-gateway-runtime
  cancel-in-progress: true
jobs:
  compile-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out current simulator source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1
      - name: Check out isolated authenticated gateway
        uses: actions/checkout@v4
        with:
          ref: ata24-guest-gateway
          path: gateway
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile verified browser runtime and boot assets
        working-directory: source
        run: |
          node --test tests/final10-approach-unified-v1.test.cjs tests/flight-phase-shell-v1.test.cjs tests/unified-web-build.test.cjs tests/unified-runtime-performance-v2.test.cjs tests/unified-testlabs-visible.test.cjs tests/fcc-flight-guidance-v1.test.cjs tests/flight-control-laws-v1.test.cjs tests/classic-low-speed-envelope-v1.test.cjs tests/le-devices-unified-link.test.cjs tests/flight-envelope-le-external-port-v1.test.cjs tests/le-devices-owner-sequence-v1.test.cjs tests/fcc-director-visual-servo-v1.test.cjs tests/fcc-director-independent-eadi-v1.test.cjs tests/altitude-capture-training-v1.test.cjs
          node tools/export-unified-gateway-runtime.cjs gateway-fast-runtime
      - name: Sync the version-pinned public boot release
        run: |
          set -euo pipefail
          rm -rf gateway/runtime/fast-unified
          mkdir -p gateway/runtime/fast-unified
          cp -a source/gateway-fast-runtime/. gateway/runtime/fast-unified/
          git -C gateway add runtime/fast-unified
          if git -C gateway diff --cached --quiet; then
            echo "Compiled Gateway runtime is unchanged"
            exit 0
          fi
          git -C gateway config user.name "github-actions[bot]"
          git -C gateway config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gateway commit -m "perf(gateway): version-matched compiled Unified ${GITHUB_SHA:0:12}"
          git -C gateway push origin HEAD:ata24-guest-gateway
  verify-release:
    needs: compile-and-sync
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: source_mirror
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d source_mirror"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:test-only@127.0.0.1:5432/source_mirror
      LAB_USER: ci-reviewer
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ata24-guest-gateway
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release identity and install browser dependencies
        run: |
          node -e 'require("node:assert/strict").equal(require("./runtime/fast-unified/manifest.json").sourceCommit,process.env.GITHUB_SHA)'
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright@1.58.2 --no-audit --no-fund
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Boot and measure the authenticated Gateway
        run: |
          set -euo pipefail
          SALT="$(openssl rand -hex 16)"
          HASH="$(node -e 'const c=require("node:crypto");process.stdout.write(c.scryptSync("ci-only-fixture",process.argv[1],64).toString("hex"))' "$SALT")"
          LAB_PASSWORD_SCRYPT="scrypt:$SALT:$HASH" node server.js >/tmp/unified-release.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz | grep -qx ok; then break; fi
            sleep 1
          done
          node tests/gateway-boot-performance.test.cjs
          node tests/guest-fast-startup.integration.cjs
      - name: Show fixture launch log
        if: always()
        run: if [ -f /tmp/unified-release.log ]; then tail -30 /tmp/unified-release.log; fi
