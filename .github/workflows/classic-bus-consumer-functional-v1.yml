name: Classic Electrical 340 Consumers Functional QA
on:
  push:
    branches: [main]
    paths:
      - 'engine/systems/classic-bus-consumer-engine-v1.js'
      - 'engine/systems/classic-bus-consumer-test-lab-v1.js'
      - 'bus-consumer-test-lab/**'
      - 'tests/classic-bus-consumer-test-lab-v1.test.cjs'
      - 'tests/classic-bus-consumer-fmc-fuel-cdu-binary-v1.test.cjs'
      - 'tests/classic-bus-consumer-optional-and-interphone-power-v1.test.cjs'
      - 'tests/classic-bus-consumer-test-lab-ui-v1.test.cjs'
      - 'engine/systems/mrg-classic-340-consumer-bus-index-v1.json'
      - 'engine/integration/isn-electrical-pack-v1.js'
      - 'panel-mosaic-lab/cockpit/bus-consumer-unified-v1.js'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'panel-mosaic-lab/cockpit/autobrake-unified-v1.js'
      - 'tests/eis-autobrake-unified-v1.test.cjs'
      - 'tests/classic-bus-consumer-functional-v1.test.cjs'
      - '.github/workflows/classic-bus-consumer-functional-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bus-consumer-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Functional Classic 340 bus and pump scenarios
        run: |
          node tests/classic-bus-consumer-functional-v1.test.cjs
          node tests/classic-bus-consumer-test-lab-v1.test.cjs
          node tests/classic-bus-consumer-fmc-fuel-cdu-binary-v1.test.cjs
          node tests/classic-bus-consumer-optional-and-interphone-power-v1.test.cjs
          node tests/classic-bus-consumer-test-lab-ui-v1.test.cjs
          node tests/engine-indication-tech-db-v1.test.cjs
          node tests/engine-indication-source-power-ata77-v2.test.cjs
          node tests/engine-indication-unified-live-v2.test.cjs
          node tests/isn-electrical-pack-v1.test.cjs
          node tests/eis-autobrake-unified-v1.test.cjs
          node tests/electrical-v7.test.cjs
      - name: Parse client and backend modules
        run: |
          node --check engine/systems/classic-bus-consumer-engine-v1.js
          node --check engine/systems/classic-bus-consumer-test-lab-v1.js
          node --check bus-consumer-test-lab/app.js
          node --check panel-mosaic-lab/cockpit/bus-consumer-unified-v1.js
          node --check engine/integration/isn-electrical-pack-v1.js
          node --check panel-mosaic-lab/cockpit/autobrake-unified-v1.js
      - name: Preserve photo and protected control assets
        run: python3 panel-mosaic-lab/verify-final-overhead.py
