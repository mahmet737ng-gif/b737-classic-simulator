name: B737 737-400 CPCS DCPCS lamp profile visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - tools/test-lamp-profile-visual-qa.cjs
      - .github/workflows/lamp-profile-visual-qa.yml
permissions:
  contents: read
jobs:
  visual-profile-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked original overhead unchanged
        run: python3 panel-mosaic-lab/verify-final-overhead.py
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve cockpit and run four-profile OFF ON matrix
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/test-lamp-profile-visual-qa.cjs
          python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/b737-variant-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/panel-mosaic-lab/cockpit/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tools/test-lamp-profile-visual-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b737-4-profile-photo-lamp-OFF-ON-screenshots
          path: /tmp/b737-lamp-variant-evidence
          if-no-files-found: warn
          retention-days: 30
