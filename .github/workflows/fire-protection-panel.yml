name: Fire Protection Panel QA
on:
  push:
    paths:
      - 'fire-protection-lab/**'
      - 'audio/fire-bell-aural-gate-v1.js'
      - 'panel-mosaic-lab/cockpit/fire-bell-audio-unified-v1.js'
      - 'panel-mosaic-lab/cockpit/fire-hardware-unified.js'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'tests/fire-bell-owner-audio-v1.test.cjs'
      - '.github/workflows/fire-protection-panel.yml'
  pull_request:
    paths:
      - 'fire-protection-lab/**'
      - '.github/workflows/fire-protection-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Fire Protection model and data paths
        run: |
          node --check fire-protection-lab/engine.js
          node --test fire-protection-lab/tests/engine.test.cjs fire-protection-lab/tests/thermal-trainer.test.cjs
          node fire-protection-lab/tests/assets.test.cjs
          node fire-protection-lab/tests/geometry-v2.test.cjs
          node fire-protection-lab/tests/video-scenarios.test.cjs
          node --check audio/fire-bell-aural-gate-v1.js
          node --check panel-mosaic-lab/cockpit/fire-bell-audio-unified-v1.js
          node --check panel-mosaic-lab/cockpit/fire-hardware-unified.js
          node tests/fire-bell-owner-audio-v1.test.cjs
