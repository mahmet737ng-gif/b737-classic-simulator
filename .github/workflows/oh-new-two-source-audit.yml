name: Inspect newly uploaded OH source images
on:
  push:
    paths:
      - '.github/workflows/oh-new-two-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render safe preview and source integrity metadata
        shell: bash
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import io,hashlib,base64
          root=Path('panel-mosaic-lab/assets/locked/2026-10-23')
          names=['Blanked Aircraft Avionics Control Panel.png','Empty Aircraft Cockpit Control Panel.png']
          for i,name in enumerate(names):
              raw=(root/name).read_bytes()
              im=Image.open(io.BytesIO(raw)).convert('RGB')
              print('SOURCE',i,name,'ORIGINAL_SIZE',im.size,'BYTES',len(raw),'SHA256',hashlib.sha256(raw).hexdigest())
              if i==1:
                  from PIL import ImageChops
                  diff=ImageChops.difference(im,Image.new('RGB',im.size,(255,255,255)))
                  print('BOTTOM_NONWHITE_BBOX',diff.point(lambda value:255 if value>55 else 0).getbbox())
                  im=im.crop((0,0,im.width,round(im.height*.65)))
              im.thumbnail((1100,400))
              mem=io.BytesIO()
              im.save(mem,'JPEG',quality=44,optimize=True)
              print('PREVIEW_START_'+str(i))
              print(base64.b64encode(mem.getvalue()).decode('ascii'))
              print('PREVIEW_END_'+str(i))
          PY
