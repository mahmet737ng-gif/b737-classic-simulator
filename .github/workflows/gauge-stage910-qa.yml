name: Gauge Stage 9-10 Motion and Unified Integration QA
on:
  push:
    branches: [main]
    paths:
      - 'engine/instruments/stage5-scale-mapping-v1.js'
      - 'engine/instruments/stage9-needle-dynamics-v1.js'
      - 'engine/instruments/stage9-dynamics-registry-v1.json'
      - 'engine/instruments/stage10-needle-workbench-v1.js'
      - 'engine/instruments/stage10-preview-scale-subset-v1.json'
      - 'engine/instruments/stage9-stage10.test.cjs'
      - 'engine/instruments/source-arc-contact-audit-v1.py'
      - 'engine/instruments/native-bezel-centre-evidence-v1.json'
      - 'engine/instruments/native-bezel-centre-v1.test.cjs'
      - 'engine/instruments/oh12-ac-amps-photo-graduations-v1.json'
      - 'engine/instruments/oh12-ac-amps-original-photo-qa-v1.py'
      - 'engine/instruments/oh12-ac-amps-photo-calibration-v1.test.cjs'
      - 'engine/instruments/oh10-source-radial-graduations-v1.json'
      - 'engine/instruments/oh10-38-tick-source-pixel-qa-v1.py'
      - 'engine/instruments/oh10-source-radial-calibration-v1.test.cjs'
      - 'engine/instruments/native-bezel-centre-validation-v1.py'
      - 'engine/instruments/native-verified-division-intervals-v1.json'
      - 'engine/instruments/native-photo-scale-label-inventory-v1.json'
      - 'engine/instruments/native-source-scale-inventory-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/ac-dc-metering-*'
      - 'panel-mosaic-lab/cockpit/drive-amps-needle-*'
      - 'engine/instruments/native-arc-scale-v1.js'
      - 'engine/instruments/native-arc-scale-v1.test.cjs'
      - 'engine/instruments/oh19-photo-evidence-v2.js'
      - 'engine/instruments/oh19-photo-evidence-v2.test.cjs'
      - 'engine/instruments/oh19-native-ticks-batch1.json'
      - 'engine/instruments/oh19-source-pixel-intensity-v2.py'
      - 'engine/instruments/oh19-photo-overlay-v2.cjs'
      - 'engine/instruments/oh19-native-hub-center-v1.py'
      - 'engine/instruments/oh19-shaft-*'
      - 'panel-mosaic-lab/cockpit/stage78-readonly-unified.js'
      - 'panel-mosaic-lab/cockpit/index.html'
      - '.github/workflows/gauge-stage910-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-and-render-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise 38 pointer routes, 8 scale previews, response physics and fail-safe behaviour
        run: node --test engine/instruments/stage9-stage10.test.cjs
      - name: Regression-test source-photo numeric maps and Unified event wiring
        run: node --test engine/instruments/stage5-stage6.test.cjs engine/instruments/stage78-unified-integration.test.cjs
      - name: Run source-aware 7 and 8 bridge tests
        run: node --test engine/instruments/stage7-stage8.test.cjs
      - name: Assert original immutable overhead panel art
        run: python3 panel-mosaic-lab/verify-final-overhead.py
      - name: Verify OH19 real source photo and record 98 contrast samples without certification
        run: |
          node --test engine/instruments/oh19-photo-evidence-v2.test.cjs
          node engine/instruments/oh19-photo-overlay-v2.cjs
          python3 -m pip install --quiet pillow
          python3 engine/instruments/oh19-source-pixel-intensity-v2.py
          python3 engine/instruments/oh19-native-hub-center-v1.py
          python3 -c "import json; p=json.load(open('artifacts/oh19-pixel-qa/OH19_SOURCE_PIXEL_INTENSITIES.json')); from statistics import mean; print('OH19 original-photo contrast samples',len(p['points'])); print('Inner mean white contrast',round(mean(x['localWhiteContrast'] for x in p['points'] if x['ring']=='inner'),4)); print('Outer mean white contrast',round(mean(x['localWhiteContrast'] for x in p['points'] if x['ring']=='outer'),4)); print('SHA256',p['sourceSha256']); print('PIXEL_GEOMETRY_OPERATIONAL_APPROVAL',p['operationalNeedlesReleased'])"
      - name: Preserve annotated original OH19 photo and native-pixel evidence
        uses: actions/upload-artifact@v4
        with:
          name: OH19-pixel-inspection-native
          path: artifacts/oh19-pixel-qa/
          retention-days: 30
          if-no-files-found: error
      - name: Exercise all 11 real-photo pivot records and approved geometric minor-division engine
        run: |
          node --test engine/instruments/native-arc-scale-v1.test.cjs engine/instruments/native-bezel-centre-v1.test.cjs engine/instruments/native-source-scale-inventory-v1.test.cjs
          node panel-mosaic-lab/cockpit/ac-dc-metering.test.cjs
          node --test engine/instruments/oh10-source-radial-calibration-v1.test.cjs
          node panel-mosaic-lab/cockpit/drive-amps-needle.test.cjs
          node --test engine/instruments/oh12-ac-amps-photo-calibration-v1.test.cjs
      - name: Inspect 11 native OH10 OH11 OH12 OH20 OH21 source gauge pivots and arcs
        run: python3 engine/instruments/source-arc-contact-audit-v1.py
      - name: Native-source fitted circles and SHA256 photo evidence
        run: python3 engine/instruments/native-bezel-centre-validation-v1.py
      - name: Refit 42 OH12 original photo white strokes and assert actual A scale needle clearance
        run: |
          python3 -m pip install --quiet opencv-python-headless
          python3 engine/instruments/oh12-ac-amps-original-photo-qa-v1.py
          python3 engine/instruments/oh10-38-tick-source-pixel-qa-v1.py
      - name: Preserve native panel pivot and arc review sheets
        uses: actions/upload-artifact@v4
        with:
          name: OH10-12-OH20-21-source-arc-pivot-audit
          path: artifacts/native-arc-audit/
          retention-days: 30
          if-no-files-found: error
