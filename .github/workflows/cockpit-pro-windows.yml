name: Cockpit Pro - Windows Offline Setup
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'panel-mosaic-lab/desktop-shell/**'
      - '.github/workflows/cockpit-pro-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cockpit-pro-windows
  cancel-in-progress: false
jobs:
  setup-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Preserve approved source bytes on Windows checkout
        run: git config --global core.autocrlf false
      - name: Checkout current cockpit and system engines
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Fetch immutable owner approval anchors
        run: git fetch --depth 1 origin 730815ed6ece9beb30950b96ba536e1ce3f2c4ca ec70014f2436caa912e65aba789287a17c2378c3 3cd894d061a5d33ac90f0cb0cdcd50a2eec0f1db
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Verify offline files, updater failure handling and owner locks
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --test desktop/*.test.cjs
          node --test panel-mosaic-lab/desktop-shell/shell-static.test.cjs
          python panel-mosaic-lab/verify-final-overhead.py
          python panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
          python panel-mosaic-lab/cockpit/verify-irs-complete-redzone-v1.py --negative-self-test
          python panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py
          python panel-mosaic-lab/cockpit/verify-irs-13seg-owner-lock-v1.py --negative-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source integrity failed' }
      - name: Build Windows x64 offline installer with update metadata
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Native EXE launch and control response, external requests blocked
        working-directory: desktop
        run: npm run smoke:win
      - name: Verify release feed and produce installer checksum
        shell: pwsh
        run: |
          node desktop/verify-release.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
          $setup = Get-ChildItem desktop/dist/CockpitPro-Setup-*.exe | Select-Object -First 1
          $hash = Get-FileHash -Algorithm SHA256 $setup.FullName
          "$($hash.Hash.ToLower())  $($setup.Name)" | Set-Content desktop/dist/CockpitPro-Setup-SHA256.txt -Encoding ascii
      - name: Upload installer and native timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CockpitPro-Windows-x64
          path: |
            desktop/dist/CockpitPro-Setup-*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
            desktop/dist/CockpitPro-Setup-SHA256.txt
            desktop/dist/startup-*.json
            desktop/dist/startup-*.png
          retention-days: 60
          if-no-files-found: warn
      - name: Publish a new immutable in-app update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump desktop/package.json; never overwrite an installed release." }
          gh release create $tag --draft --repo ${{ github.repository }} --target "${{ github.sha }}" --title "Cockpit Pro $version - Windows x64" --notes-file desktop/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release upload $tag "desktop/dist/CockpitPro-Setup-$version.exe" "desktop/dist/CockpitPro-Setup-$version.exe.blockmap" "desktop/dist/CockpitPro-Setup-SHA256.txt" "desktop/dist/startup-benchmark.json" --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed' }
          gh release upload $tag desktop/dist/latest.yml --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw 'Update feed upload failed' }
          gh release edit $tag --draft=false --prerelease=false --latest --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
