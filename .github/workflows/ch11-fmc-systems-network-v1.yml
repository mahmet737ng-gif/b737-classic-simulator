name: CH11 FMC systems bridge QA
on:
  push:
    paths:
      - 'engine/ch11/fmc-systems-network-v1.js'
      - 'engine/ch11/tests/fmc-systems-network-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/cdu-fmc-telemetry-v1.js'
      - 'panel-mosaic-lab/cockpit/fmc-systems-bridge-v1.js'
      - 'panel-mosaic-lab/cockpit/cdu-embed.css'
      - 'panel-mosaic-lab/cockpit/tests/cdu-embed-typography-v2.test.cjs'
      - 'panel-mosaic-lab/cockpit/cdu-font-diagnostics-v3.js'
      - 'panel-mosaic-lab/cockpit/cdu-stage.html'
      - 'panel-mosaic-lab/cockpit/assembly.json'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'cdu-standalone-v6/data/page-definitions.json'
      - 'cdu-standalone-v6/data/page-definitions.js'
      - 'cdu-standalone-v6/engine/cdu-engine.js'
      - 'cdu-standalone-v6/app.js'
      - 'cdu-standalone-v6/tests/ch11-position-pages-v1.test.cjs'
      - 'engine/runtime/avionics-data-network-v1.js'
      - 'engine/integration/avionics-fmc-computer-v1.js'
      - 'engine/runtime/tests/avionics-data-network-v1.test.cjs'
      - 'engine/runtime/tests/avionics-unified-adapters-v1.test.cjs'
      - 'engine/integration/avionics-sensor-ingress-v2.js'
      - 'engine/runtime/tests/avionics-sensor-ingress-v2.test.cjs'
      - 'panel-mosaic-lab/cockpit/avionics-network-runtime-v1.js'
      - 'docs/AVIONICS_FMC_DATA_NETWORK_V1_2026-10-30_FA.md'
      - '.github/workflows/ch11-fmc-systems-network-v1.yml'
  workflow_dispatch:
jobs:
  static-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine/ch11/fmc-systems-network-v1.js
      - run: node --check panel-mosaic-lab/cockpit/cdu-fmc-telemetry-v1.js
      - run: node --check panel-mosaic-lab/cockpit/fmc-systems-bridge-v1.js
      - run: node --check engine/runtime/avionics-data-network-v1.js
      - run: node --check engine/integration/avionics-fmc-computer-v1.js
      - run: node --check engine/integration/avionics-sensor-ingress-v2.js
      - run: node --check panel-mosaic-lab/cockpit/avionics-network-runtime-v1.js
      - run: node --test engine/runtime/tests/avionics-data-network-v1.test.cjs
      - run: node --test engine/runtime/tests/avionics-unified-adapters-v1.test.cjs
      - run: node --test engine/runtime/tests/avionics-sensor-ingress-v2.test.cjs
      - run: node --test engine/ch11/tests/fmc-systems-network-v1.test.cjs
      - run: node --test cdu-standalone-v6/tests/ch11-position-pages-v1.test.cjs
      - run: node --check panel-mosaic-lab/cockpit/cdu-font-diagnostics-v3.js
      - run: node --check panel-mosaic-lab/cockpit/app.js
      - run: node --test panel-mosaic-lab/cockpit/tests/cdu-embed-typography-v2.test.cjs
      - run: node tests/cdu-font-lock.test.cjs
