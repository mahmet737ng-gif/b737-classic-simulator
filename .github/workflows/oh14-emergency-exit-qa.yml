name: OH14 Emergency Exit Lights physical selector and NOT ARMED QA
on:
  push:
    branches: [main]
    paths:
      - 'panel-mosaic-lab/interactive-overhead/lights.js'
      - 'panel-mosaic-lab/interactive-overhead/lights-model.js'
      - 'panel-mosaic-lab/interactive-overhead/lights.css'
      - 'panel-mosaic-lab/interactive-overhead/lights.test.cjs'
      - '.github/workflows/oh14-emergency-exit-qa.yml'
  pull_request:
    paths:
      - 'panel-mosaic-lab/interactive-overhead/lights.js'
      - 'panel-mosaic-lab/interactive-overhead/lights-model.js'
      - 'panel-mosaic-lab/interactive-overhead/lights.css'
      - 'panel-mosaic-lab/interactive-overhead/lights.test.cjs'
      - '.github/workflows/oh14-emergency-exit-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oh14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check live overhead model, physical selector and APU needle
        run: |
          node --check panel-mosaic-lab/interactive-overhead/lights.js
          node --check panel-mosaic-lab/interactive-overhead/lights-model.js
          node --check panel-mosaic-lab/cockpit/apu-egt-needle-unified.js
      - name: Assert photo geometry and OH14 OFF ARMED ON annunciator
        run: node panel-mosaic-lab/interactive-overhead/lights.test.cjs
      - name: Verify immutable original overhead source panels
        run: python3 panel-mosaic-lab/verify-final-overhead.py
