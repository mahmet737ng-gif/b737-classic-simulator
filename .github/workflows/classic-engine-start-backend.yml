name: Classic Engine Start Backend
on:
  push:
    paths: ['engine/integration/isn-13-18-ecu-testbench-v1.js', 'engine/integration/isn-apu-start-chain-v1.js', 'engine/systems/classic-engine-start-logic-v2.js', 'tests/classic-engine-start-backend-v1.test.cjs', '.github/workflows/classic-engine-start-backend.yml']
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine/integration/isn-13-18-ecu-testbench-v1.js
      - run: node --check engine/integration/isn-apu-start-chain-v1.js
      - run: node tests/classic-engine-start-backend-v1.test.cjs
      - run: node tests/isn-start-fcom-rules-v1.test.cjs
      - run: node tests/isn-start-abnormal-scenarios-v2.test.cjs
      - run: node tests/isn-duct-pressure-start-and-flight-fuel-v1.test.cjs
