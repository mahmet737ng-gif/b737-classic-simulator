name: Conventional physical controls source-photo inspection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/conventional-physical-controls-photo.yml'
      - 'panel-mosaic-lab/cockpit/conventional-physical-controls-v1.js'
      - 'panel-mosaic-lab/cockpit/conventional-physical-controls-v1.css'
      - 'panel-mosaic-lab/cockpit/conventional-physical-controls-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/lights-model.js'
      - 'panel-mosaic-lab/cockpit/autobrake-unified-v1.js'
      - 'engine/systems/autobrake-classic-v1.js'
      - 'engine/systems/autobrake-classic-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/autobrake-rto-selftest-v1.test.cjs'
      - 'tools/test-conventional-physical-controls-browser.cjs'
      - 'panel-mosaic-lab/cockpit/index.html'
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read original Conventional photograph and export physical control apertures
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          im=Image.open('panel-mosaic-lab/cockpit/assets/p2-conventional-full-owner-20261030.png').convert('RGB')
          print('CONV_SOURCE', im.size)
          os.makedirs('/tmp/conventional-controls-photo',exist_ok=True)
          im.save('/tmp/conventional-controls-photo/whole-panel.png')
          im.crop((950,350,1463,1075)).resize((1026,1450)).save('/tmp/conventional-controls-photo/skid-brake-source-2x.png')
          im.crop((1000,650,1463,1075)).resize((926,850)).save('/tmp/conventional-controls-photo/autobrake-bottom-2x.png')
          knob=Image.open('panel-mosaic-lab/assets/locked/2026-10-23/Switches/Rotary/rotary-standard-v1.webp')
          print('KNOB_SOURCE',knob.size)
          knob.save('/tmp/conventional-controls-photo/rotary-database-preview.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: conventional-control-photos
          path: /tmp/conventional-controls-photo/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source-photo geometry, EIS isolation and six detents
        run: |
          node --check panel-mosaic-lab/cockpit/conventional-physical-controls-v1.js
          node --check tools/test-conventional-physical-controls-browser.cjs
          node panel-mosaic-lab/cockpit/conventional-physical-controls-v1.test.cjs
          node panel-mosaic-lab/cockpit/autobrake-rto-selftest-v1.test.cjs
          node engine/systems/autobrake-classic-v1.test.cjs
          node --check panel-mosaic-lab/cockpit/autobrake-unified-v1.js
      - name: Install Chromium for native-photo visual verification
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Render actual Conventional/EIS and exercise ON/OFF plus AUTO BRAKE detents
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/conventional-physical-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/panel-mosaic-lab/cockpit/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tools/test-conventional-physical-controls-browser.cjs
      - name: Archive Chromium screenshot with actual switch and rotary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conventional-physical-controls-live-browser
          path: |
            /tmp/b737-conv-skid-autobrake-browser.png
            /tmp/b737-conv-rto-disarm-on.png
          if-no-files-found: ignore
          retention-days: 14
