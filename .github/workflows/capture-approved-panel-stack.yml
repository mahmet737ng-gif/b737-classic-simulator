name: Capture approved two-panel layout
on:
  push:
    branches: [main]
    paths:
      - 'approved-panel-stack/index.html'
      - '.github/workflows/capture-approved-panel-stack.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact approved panels without reconstruction
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/panel-stack-server.log 2>&1 &
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=8000 --window-size=760,2680 --screenshot=approved-panel-stack/preview.png http://127.0.0.1:8765/approved-panel-stack/ || true
          test -s approved-panel-stack/preview.png
          file approved-panel-stack/preview.png
          python3 -m pip install --quiet --user pillow
          python3 - <<'PY'
          from PIL import Image
          import statistics
          fuel=Image.open('fuel-panel/assets/fuel-panel-front-v3-empty-switches.png').convert('RGBA')
          print('FUEL_ASSET_SIZE',fuel.size)
          for pct in [5,15,25,35,50,65,80,95]:
              y=int(fuel.height*pct/100)
              row=fuel.crop((0,y,fuel.width,min(fuel.height,y+8)))
              samples=list(row.getdata())[::50]
              print('FUEL_ASSET_ROW',pct,
                    'RGB_STD',round(statistics.pstdev([sum(p[:3])/3 for p in samples]),1),
                    'ALPHA_MINMAX',(min(p[3] for p in samples),max(p[3] for p in samples)))
          im=Image.open('approved-panel-stack/preview.png').convert('RGB')
          im.thumbnail((690,2900),Image.Resampling.LANCZOS)
          im.save('approved-panel-stack/preview.jpg',quality=86,optimize=True,progressive=True)
          PY
          test -s approved-panel-stack/preview.jpg
      - name: Publish exact screenshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approved-panel-stack/preview.png approved-panel-stack/preview.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(cockpit): screenshot of existing Flight Controls over Fuel'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
