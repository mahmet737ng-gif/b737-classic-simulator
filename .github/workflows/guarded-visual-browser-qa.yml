name: Unified active guards cleared QA
on:
  push:
    paths:
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'panel-mosaic-lab/cockpit/overhead-stage.html'
      - 'panel-mosaic-lab/interactive-overhead/rotary-guards.json'
      - 'panel-mosaic-lab/interactive-overhead/lights-controls.json'
      - 'panel-mosaic-lab/interactive-overhead/no-old-guards.test.cjs'
      - '.github/workflows/guarded-visual-browser-qa.yml'
  workflow_dispatch:
jobs:
  guard-empty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert active guard registry and preview entrypoints are empty
        run: |
          node panel-mosaic-lab/interactive-overhead/no-old-guards.test.cjs
          node panel-mosaic-lab/interactive-overhead/rotary-guards.test.cjs
      - name: Assert old guard nodes are absent in rendered overhead
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/overhead-reset-server.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME" || { echo "Chromium unavailable"; exit 2; }
          "$CHROME" --headless --disable-gpu --disable-dev-shm-usage --no-sandbox --hide-scrollbars --virtual-time-budget=18000 --window-size=1440,900 --dump-dom "http://127.0.0.1:8765/panel-mosaic-lab/cockpit/overhead-stage.html" >/tmp/overhead-reset-dom.html 2>/tmp/overhead-reset-browser.log
          if grep -q 'class="guard-node' /tmp/overhead-reset-dom.html; then
            echo 'FAIL: Old guarded controls still mounted'
            exit 1
          fi
          if grep -q 'g17-owner-hardware' /tmp/overhead-reset-dom.html; then
            echo 'FAIL: Old owner sprites still mounted'
            exit 1
          fi
          grep -q 'id="rotaryGuardLayer"' /tmp/overhead-reset-dom.html || { echo "FAIL: Rotary layer did not load"; tail -20 /tmp/overhead-reset-browser.log; exit 1; }
          grep -q 'data-old-guard-apertures="13"' /tmp/overhead-reset-dom.html || { echo 'FAIL: 13 image-backed old-guard apertures were not masked'; exit 1; }
          grep -q 'data-old-guard-visuals-removed="true"' /tmp/overhead-reset-dom.html || { echo 'FAIL: mask coverage or live guard count not clean'; exit 1; }
          test "$(grep -o 'class="b737-removed-old-guard"' /tmp/overhead-reset-dom.html | wc -l)" -eq 13 || { echo 'FAIL: expected exactly 13 retired photo guard slots'; exit 1; }
          echo 'PASS: all 13 original photographic guard-cover positions are covered in the Unified overhead DOM.'
          echo 'PASS: zero guarded-switch DOM instances; rotaries remain available'
