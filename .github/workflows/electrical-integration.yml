name: Electrical Integration Pilot
on:
  push:
    branches:
      - design/integrated-systems-network-v01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  electrical-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax validation
        run: |
          node --check engine/network/electrical-power-pilot.cjs
          node --check engine/network/fire-detection-pilot.cjs
          node --check tests/electrical-integration.test.cjs
          node --check tests/system-network.test.cjs
          node --check engine/network/pump-sensor-warning-engine.cjs
          node --check engine/network/integrated-aircraft-kernel.cjs
          node --check engine/network/electrical-feeder-audit.v0.2.cjs
          node --check engine/network/pressure-distribution.v0.2.cjs
          node --check engine/network/electrical-consumer-feeders.cjs
          node --check engine/network/fluid-pressure-engine.cjs
          node --check tests/feeder-pressure-stages.test.cjs
          node --check engine/network/sensor-failure-engine.cjs
          node --check engine/network/annunciation-output-engine.cjs
          node --check tests/annunciation-integration.test.cjs
          node --check tests/sensor-failure-network.test.cjs
          node --check tests/pump-warning-network.test.cjs
          node --check engine/network/electrical-feeder-audit.v0.2.cjs
          node --check engine/network/pressure-distribution.v0.2.cjs
          node --check engine/network/electrical-consumer-feeders.cjs
          node --check engine/network/fluid-pressure-engine.cjs
          node --check tests/electrical-pressure-stage12.test.cjs
          node --check tools/build-power-consumers-lab.cjs
          node --check power-consumers-lab/runtime.js
          node --check tests/power-consumers-browser.test.cjs
      - name: Check source-traced integration graph and fire-loop pilot
        run: node tests/system-network.test.cjs
      - name: Check Electrical AC/DC standby plus cross-system fault propagation
        run: node tests/electrical-integration.test.cjs
      - name: Verify real pump-state, discrete sensor and warning derivation
        run: node tests/pump-warning-network.test.cjs
      - name: Verify source-audited pump feeders and qualitative fuel hydraulic pressure stage 1+2
        run: node tests/electrical-pressure-stage12.test.cjs
      - name: Verify stage 1 electrical feeder maps and stage 2 hydraulic fuel pressure
        run: node tests/feeder-pressure-stages.test.cjs
      - name: Check independent sensor faults and pressure/annunciator validity
        run: node tests/sensor-failure-network.test.cjs
      - name: Verify ISN-05 annunciation, fire caution cutout and aural intents
        run: node tests/annunciation-integration.test.cjs
      - name: Assert generated browser engine matches shared Node source
        run: node tools/build-power-consumers-lab.cjs --check
      - name: Browser runtime parity and deterministic events
        run: node tests/power-consumers-browser.test.cjs
