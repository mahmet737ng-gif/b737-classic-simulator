name: EP-FSI AFM N1 v10 Test
on:
  push:
    branches: [main]
    paths:
      - 'engine/fmc/performance/**'
      - 'cdu-standalone/**'
      - 'tests/afm-epfsi-n1-v10.test.cjs'
      - 'tests/n1-interpolation-guard-v11.test.cjs'
      - 'tests/afm-epfsi-n1-conditions-v12.test.cjs'
      - 'tests/afm-epfsi-mct-v13.test.cjs'
      - 'tests/afm-epfsi-source-vectors-v14.test.cjs'
      - 'tests/afm-epfsi-n1-v15-release-gate.test.cjs'
      - 'tests/afm-epfsi-pmc-off-v16.test.cjs'
      - 'tests/epfsi-scenario-defaults-v17.test.cjs'
      - 'tests/epfsi-present-n1-v18.test.cjs'
      - 'tests/epfsi-simulated-n1-v19.test.cjs'
      - 'package.json'
      - '.github/workflows/epfsi-n1-v10-tests.yml'
  workflow_dispatch:
jobs:
  source-guard-and-cdu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax and N1 source gate
        run: |
          node --check engine/fmc/performance/afm-epfsi-n1-v10.cjs
          node --check cdu-standalone/app.js
          node tests/afm-epfsi-n1-v10.test.cjs
          node --check engine/fmc/performance/n1-interpolation-guard-v11.cjs
          node tests/n1-interpolation-guard-v11.test.cjs
          node --check engine/fmc/performance/afm-epfsi-n1-conditions-v12.cjs
          node tests/afm-epfsi-n1-conditions-v12.test.cjs
          node --check engine/fmc/performance/afm-epfsi-mct-v13.cjs
          node tests/afm-epfsi-mct-v13.test.cjs
          node tests/afm-epfsi-source-vectors-v14.test.cjs
          node tests/afm-epfsi-n1-v15-release-gate.test.cjs
          node --check engine/fmc/performance/afm-epfsi-pmc-off-v16.cjs
          node tests/afm-epfsi-pmc-off-v16.test.cjs
          node --check engine/fmc/performance/epfsi-scenario-defaults-v17.cjs
          node tests/epfsi-scenario-defaults-v17.test.cjs
          node --check engine/fmc/indications/present-n1-bridge-v18.cjs
          node tests/epfsi-present-n1-v18.test.cjs
          node --check engine/fmc/performance/epfsi-simulated-n1-v19.cjs
          node tests/epfsi-simulated-n1-v19.test.cjs
      - name: Standalone CDU headless state and compatibility
        run: |
          node cdu-standalone/tests/smoke.test.cjs
          node cdu-standalone/tests/n1-v10-integration.test.cjs
          node cdu-standalone/tests/defaults-v17-integration.test.cjs
          node cdu-standalone/tests/present-n1-v18-integration.test.cjs
          node cdu-standalone/tests/estimated-n1-v19-integration.test.cjs
