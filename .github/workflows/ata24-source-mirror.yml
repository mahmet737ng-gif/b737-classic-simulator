name: ATA24 Source Mirror Integration
on:
  push:
    branches: [ata24-guest-gateway]
    paths:
      - server.js
      - public/guest-cockpit.js
      - public/guest-cockpit.css
      - tests/guest-source-mirror.integration.cjs
      - .github/workflows/ata24-source-mirror.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: source_mirror
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d source_mirror"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:test-only@127.0.0.1:5432/source_mirror
      LAB_USER: ci-reviewer
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and syntax-check gateway
        run: |
          npm install --no-audit --no-fund
          node --check server.js
          node --check public/guest-cockpit.js
      - name: Start server with temporary test-only credentials
        shell: bash
        run: |
          set -euo pipefail
          SALT="$(openssl rand -hex 16)"
          HASH="$(node -e 'const c=require("node:crypto");process.stdout.write(c.scryptSync("ci-only-fixture",process.argv[1],64).toString("hex"))' "$SALT")"
          OWNER_SALT="$(openssl rand -hex 16)"
          OWNER_HASH="$(node -e 'const c=require("node:crypto");process.stdout.write(c.scryptSync("ci-unlimited-fixture",process.argv[1],64).toString("hex"))' "$OWNER_SALT")"
          LAB_PASSWORD_SCRYPT="scrypt:$SALT:$HASH" LAB_TAREGH_PASSWORD_SCRYPT="scrypt:$OWNER_SALT:$OWNER_HASH" node server.js >/tmp/source-gateway.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/healthz | grep -qx ok; then exit 0; fi
            sleep 1
          done
          cat /tmp/source-gateway.log; exit 1
      - name: Verify live GitHub source, controls, photo, and device limit
        run: node tests/guest-source-mirror.integration.cjs
      - name: Print server errors on failure
        if: failure()
        run: tail -80 /tmp/source-gateway.log
