name: MCP Native Photo Aperture Audit
on:
  push:
    paths:
      - ".github/workflows/mcp-original-photo-capture.yml"
permissions:
  contents: read
jobs:
  source-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print size-reduced ORIGINAL photo for registration audit
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          import io,base64,hashlib
          path="panel-mosaic-lab/assets/locked/2026-10-23/B737_MCP_Blank_Panel.png"
          data=open(path,"rb").read()
          img=Image.open(io.BytesIO(data)).convert("RGB")
          print("MCP-SOURCE-SIZE",img.size,"SHA256",hashlib.sha256(data).hexdigest())
          img.thumbnail((1448,289))
          buf=io.BytesIO()
          img.save(buf,format="JPEG",quality=83,optimize=True)
          print("MCP_ORIGINAL_JPEG_START")
          print(base64.b64encode(buf.getvalue()).decode("ascii"))
          print("MCP_ORIGINAL_JPEG_END")
          PY

      - name: Inspect exact dark apertures in ORIGINAL MCP photo
        run: |
          python3 - <<'PY'
          from PIL import Image
          from collections import deque
          import json
          p="panel-mosaic-lab/assets/locked/2026-10-23/B737_MCP_Blank_Panel.png"
          im=Image.open(p).convert("RGB")
          w,h=im.size
          src=im.load()
          dark=bytearray(w*h)
          for y in range(55,h-20):
            for x in range(15,w-15):
              r,g,b=src[x,y]
              if max(r,g,b)<64 and (max(r,g,b)-min(r,g,b))<44:
                dark[y*w+x]=1
          components=[]
          for y in range(55,h-20):
            for x in range(15,w-15):
              pos=y*w+x
              if not dark[pos]:continue
              q=[pos];dark[pos]=0
              area=0;minx=maxx=x;miny=maxy=y
              while q:
                pidx=q.pop()
                yy,xx=divmod(pidx,w)
                area+=1;minx=min(minx,xx);maxx=max(maxx,xx);miny=min(miny,yy);maxy=max(maxy,yy)
                for nxt in (pidx-1,pidx+1,pidx-w,pidx+w):
                  if 0<=nxt<w*h and dark[nxt]:
                    dark[nxt]=0;q.append(nxt)
              bw=maxx-minx+1;bh=maxy-miny+1
              if area>100 and bw>12 and bh>9:
                components.append({"x":minx,"y":miny,"w":bw,"h":bh,"area":area})
          components.sort(key=lambda c:(c["y"]//45,c["x"]))
          print("MCP_APERTURE_COMPONENTS_START")
          print(json.dumps(components,separators=(",",":")))
          print("MCP_APERTURE_COMPONENTS_END")
          PY
