name: Lamp Socket Fit QA 142
on:
  push:
    branches: [main]
    paths:
      - 'panel-mosaic-lab/lamp-socket-fit-lab/**'
      - 'tools/test-lamp-socket-fit-preview.cjs'
      - '.github/workflows/lamp-socket-fit-qa.yml'
      - 'panel-mosaic-lab/interactive-overhead/lights.json'
      - 'panel-mosaic-lab/cockpit/lights.json'
      - 'panel-mosaic-lab/lights-test/photo-pixel-registration-v5.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lamp-fit-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
      - name: Validate 142 socket locations and preview JS
        run: node tools/test-lamp-socket-fit-preview.cjs
