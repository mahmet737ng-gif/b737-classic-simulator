name: Conventional / EIS engine view regression
on:
  push:
    paths:
      - 'engine/config/aircraft-profile-v1.js'
      - 'panel-mosaic-lab/cockpit/engine-indication-mode-v1.js'
      - 'panel-mosaic-lab/cockpit/engine-indication-mode-v1.css'
      - 'panel-mosaic-lab/cockpit/assets/conventional-engine-face-v1.svg'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'tests/engine-indication-modes-v1.test.cjs'
      - 'tests/conventional-engine-needles-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/conventional-engine-needles-v1.js'
      - 'panel-mosaic-lab/cockpit/conventional-engine-needles-v1.css'
      - 'panel-mosaic-lab/cockpit/assets/conventional-needle-photo-v1.svg'
      - '.github/workflows/engine-indication-modes-v1.yml'
  pull_request:
    paths:
      - 'engine/config/aircraft-profile-v1.js'
      - 'panel-mosaic-lab/cockpit/engine-indication-mode-v1.js'
      - 'panel-mosaic-lab/cockpit/engine-indication-mode-v1.css'
      - 'panel-mosaic-lab/cockpit/assets/conventional-engine-face-v1.svg'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'tests/engine-indication-modes-v1.test.cjs'
      - 'tests/conventional-engine-needles-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/conventional-engine-needles-v1.js'
      - 'panel-mosaic-lab/cockpit/conventional-engine-needles-v1.css'
      - 'panel-mosaic-lab/cockpit/assets/conventional-needle-photo-v1.svg'
      - '.github/workflows/engine-indication-modes-v1.yml'
jobs:
  validate-engine-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # guarded-switch red-zone verifier needs its pinned historical commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: EIS / Conventional view regression
        run: |
          node tests/engine-indication-modes-v1.test.cjs
          node tests/conventional-engine-needles-v1.test.cjs
      - name: Frozen overhead check
        run: python3 panel-mosaic-lab/verify-final-overhead.py
      - name: Frozen guarded switches check
        run: python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
      - name: Frozen IRS controls check
        run: |
          python3 panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py
          python3 panel-mosaic-lab/cockpit/verify-irs-13seg-owner-lock-v1.py
