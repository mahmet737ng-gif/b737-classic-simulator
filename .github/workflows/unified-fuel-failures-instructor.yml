name: Unified FAILURES Fuel Instructor QA
on:
  push:
    paths:
      - 'panel-mosaic-lab/cockpit/failures-fuel-v1.js'
      - 'panel-mosaic-lab/cockpit/failures-header-v1.js'
      - 'panel-mosaic-lab/cockpit/failures-header-v1.css'
      - 'panel-mosaic-lab/cockpit/fuel-system-live-unified-v1.js'
      - 'panel-mosaic-lab/cockpit/isn-cockpit.js'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'engine/systems/classic-fuel-system-v1.js'
      - 'tests/unified-fuel-failures-menu-v1.test.cjs'
      - 'tests/unified-failures-header-v1.test.cjs'
      - 'tests/unified-classic-fuel-ata28-live-v1.test.cjs'
      - '.github/workflows/unified-fuel-failures-instructor.yml'
  pull_request:
    paths:
      - 'panel-mosaic-lab/cockpit/failures-fuel-v1.js'
      - 'panel-mosaic-lab/cockpit/failures-header-v1.js'
      - 'panel-mosaic-lab/cockpit/fuel-system-live-unified-v1.js'
      - 'engine/systems/classic-fuel-system-v1.js'
      - 'tests/unified-fuel-failures-menu-v1.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuel-failures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Fuel and FAILURES scripts
        run: |
          node --check panel-mosaic-lab/cockpit/failures-fuel-v1.js
          node --check panel-mosaic-lab/cockpit/failures-header-v1.js
          node --check panel-mosaic-lab/cockpit/fuel-system-live-unified-v1.js
          node --check panel-mosaic-lab/cockpit/isn-cockpit.js
          node --check engine/systems/classic-fuel-system-v1.js
      - name: Fuel injector, ECU and 24-bus Electrical isolation
        run: |
          node tests/unified-fuel-failures-menu-v1.test.cjs
          node tests/unified-failures-header-v1.test.cjs
          node tests/unified-classic-fuel-ata28-live-v1.test.cjs
      - name: Verify protected cockpit owners
        run: |
          python3 panel-mosaic-lab/verify-final-overhead.py
          python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
          python3 panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py
          python3 panel-mosaic-lab/cockpit/verify-irs-13seg-owner-lock-v1.py --negative-self-test
