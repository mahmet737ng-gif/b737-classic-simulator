name: IRS COMPLETE RED ZONE — Frozen Panel Switches and Keypad
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  irs-complete-redzone:
    name: irs-complete-redzone-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock owner-confirmed manifest and the independent verifier (no rebaseline)
        run: |
          test "$(git hash-object panel-mosaic-lab/cockpit/irs-complete-redzone-lock-v1.json)" = "05c39dc42e1d51d66820f587d284542e26926f98" || { echo "IRS RED ZONE DENIED: pinned manifest changed"; exit 1; }
          test "$(git hash-object panel-mosaic-lab/cockpit/verify-irs-complete-redzone-v1.py)" = "10b0dc9464ce6a22cbb557a5e045074be1cf1def" || { echo "IRS RED ZONE DENIED: pinned verifier changed"; exit 1; }
          python3 panel-mosaic-lab/cockpit/verify-irs-complete-redzone-v1.py --negative-self-test
      - name: Negative control — physically edit one locked IRS source and prove rejection
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          path=Path("panel-mosaic-lab/cockpit/irs-trainer-unified-v1.css")
          baseline=path.read_bytes()
          try:
              path.write_bytes(baseline+b"\n/* REDZONE_UNAUTHORIZED_MUTATION */\n")
              outcome=subprocess.run(["python3","panel-mosaic-lab/cockpit/verify-irs-complete-redzone-v1.py"],
                                     capture_output=True,text=True)
              if outcome.returncode==0 or "IRS RED ZONE MODIFICATION BLOCKED" not in outcome.stderr:
                  raise SystemExit("FAIL: unauthorized IRS physical appearance mutation was accepted\n"+outcome.stderr)
              print("PASS: unauthorized CSS/rotary modification denied")
          finally:
              path.write_bytes(baseline)
          PY
      - name: Retest exact original bytes and upstream display / SYS DSPL / guard red zones
        run: |
          python3 panel-mosaic-lab/cockpit/verify-irs-complete-redzone-v1.py
          python3 panel-mosaic-lab/cockpit/verify-irs-13seg-owner-lock-v1.py --negative-self-test
          python3 panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py
          python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
          python3 panel-mosaic-lab/verify-final-overhead.py
