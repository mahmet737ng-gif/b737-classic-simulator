name: MCP Phases 1-3 visual + AFDS QA

on:
  push:
    paths:
      - 'panel-mosaic-lab/cockpit/mcp-visual-v3.js'
      - 'panel-mosaic-lab/cockpit/mcp-visual-v3.css'
      - 'panel-mosaic-lab/cockpit/mcp-hardware-v1.js'
      - 'panel-mosaic-lab/cockpit/mcp-hardware-v1.css'
      - 'panel-mosaic-lab/cockpit/mcp-owner-photo-components-v1.css'
      - 'panel-mosaic-lab/cockpit/mcp-authentic-sprites-v2.css'
      - 'panel-mosaic-lab/cockpit/mcp-toggle-reference-v2.css'
      - 'panel-mosaic-lab/cockpit/mcp-*.test.cjs'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'panel-mosaic-lab/mcp-panel/index.html'
      - 'engine/afds/mcp-mode-core-v1.js'
      - 'panel-mosaic-lab/cockpit/mcp-afds-bridge-v1.js'
      - 'panel-mosaic-lab/cockpit/mcp-afds-bridge-v1.css'
      - '.github/workflows/mcp-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-source-and-geometry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout simulator
        uses: actions/checkout@v4
      - name: Verify frozen OH mosaic
        run: python3 panel-mosaic-lab/verify-final-overhead.py
      - name: Check MCP overlay syntax
        run: |
          node --check panel-mosaic-lab/cockpit/mcp-visual-v3.js
          node --check panel-mosaic-lab/cockpit/mcp-hardware-v1.js
          node --check engine/afds/mcp-mode-core-v1.js
          node --check panel-mosaic-lab/cockpit/mcp-afds-bridge-v1.js
      - name: Check LCD windows, lamps, and knob pivot registration
        run: node panel-mosaic-lab/cockpit/mcp-visual-v3.test.cjs
      - name: Check A/T, F/D, V/S and push controls
        run: node panel-mosaic-lab/cockpit/mcp-hardware-v1.test.cjs
      - name: Test conservative MCP power / AFDS integration
        run: node panel-mosaic-lab/cockpit/mcp-afds-bridge-v1.test.cjs
