name: Panel Mosaic Atlas QA
on:
  push:
    paths:
      - 'panel-mosaic-lab/**'
      - '.github/workflows/panel-mosaic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tile numbers, bounds, source images and JavaScript
        run: node panel-mosaic-lab/test.cjs
      - name: Verify immutable OH01-06 original SHA256 and polygons
        run: node panel-mosaic-lab/upper-oh/test.cjs
      - name: Verify entire OH01-18 preview sources and stage syntax
        run: node panel-mosaic-lab/all-overhead/test.cjs
