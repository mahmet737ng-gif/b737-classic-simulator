name: Panel Mosaic Atlas QA
on:
  push:
    paths:
      - 'panel-mosaic-lab/**'
      - '.github/workflows/panel-mosaic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tile numbers, bounds, source images and JavaScript
        run: node panel-mosaic-lab/test.cjs
      - name: Verify immutable OH01-06 original SHA256 and polygons
        run: node panel-mosaic-lab/upper-oh/test.cjs
      - name: Verify entire OH01-18 preview sources and stage syntax
        run: node panel-mosaic-lab/all-overhead/test.cjs
      - name: Exercise mosaic/gallery/atlas viewer mode controls
        run: node panel-mosaic-lab/all-overhead/runtime.test.cjs
      - name: Verify pixel-perfect atlas baseline and absolute region geometry
        run: node panel-mosaic-lab/all-overhead/atlas-layout.test.cjs
      - name: Validate independently installed CPCS / DCPCS pressure and OH22
        run: |
          node --check engine/systems/cabin-pressure-plant-v1.js
          node --check panel-mosaic-lab/cockpit/aircraft-settings.js
          node --check panel-mosaic-lab/cockpit/pressurization-oh22.js
          node tests/cpcs-v5.test.cjs
          node tests/dcpcs-v4.test.cjs
          node tests/aircraft-profile-v1.test.cjs
          node tests/cabin-pressure-plant-v1.test.cjs
          node panel-mosaic-lab/cockpit/pressurization-oh22.test.cjs
