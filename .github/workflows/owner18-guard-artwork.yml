name: Owner18 Guard Image Build and Mount QA
on:
  push:
    paths:
      - 'panel-mosaic-lab/cockpit/tools/build_owner18_artwork.py'
      - 'panel-mosaic-lab/assets/locked/2026-10-23/Switches/guard/*.png'
      - '.github/workflows/owner18-guard-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  owner18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pixel and image analysis libraries
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Crop source sprites to the common photographic bounds, preserving source RGB
        run: python panel-mosaic-lab/cockpit/tools/build_owner18_artwork.py
      - name: Commit 8 runtime owner images and pixel audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-mosaic-lab/assets/locked/2026-10-23/Switches/guard/runtime/
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Publish eight owner-locked 18-guard photo sprites without recoloring or geometry redraw"
          git pull --rebase origin main
          git push origin HEAD:main
