name: Unified load safety - LE lens v3 and OH22 remount
on:
  push:
    branches:
      - fix/unified-runtime-load-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner locks, bounds, JS, native Unified assembly
        run: |
          node --check panel-mosaic-lab/le-devices/photo-lens-v3.js
          node --check panel-mosaic-lab/cockpit/pressurization-oh22.js
          node tests/le-photolens-runtime-v3.test.cjs
          node panel-mosaic-lab/cockpit/test.cjs
          python3 panel-mosaic-lab/verify-final-overhead.py
          python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Test LE lamp geometry and real Unified iframe startup
        run: |
          set -euo pipefail
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/v3-live-server.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8788/panel-mosaic-lab/cockpit/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tools/test-le-devices-photo-lens-browser-v2.cjs
      - name: Screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-load-safe-v3-browser
          path: artifacts/le-photolens-v2/
          if-no-files-found: ignore