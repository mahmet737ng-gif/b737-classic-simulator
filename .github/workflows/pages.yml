name: Deploy B737 cockpit prototype to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Preserve an active deployment while newer parallel cockpit updates arrive.
# GitHub retains the latest pending run without interrupting in-progress pages.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block unapproved changes to all 18 OWNER FINAL RED ZONE guarded switches
        run: |
          test "$(git hash-object panel-mosaic-lab/cockpit/guard-redzone-lock.json)" = "beb7caa9dd5d888f4135a0b757c181b061c701dc" || { echo "OWNER18: manifest is no longer the owner-approved lock"; exit 1; }
          test "$(git hash-object engine/maps/guard-owner18-redzone-v1.json)" = "beb7caa9dd5d888f4135a0b757c181b061c701dc" || { echo "OWNER18: engine is no longer the owner-approved lock"; exit 1; }
          test "$(git hash-object panel-mosaic-lab/cockpit/verify-guard-redzone.py)" = "6e4c322fd4297525f7db2a700991f741b5563824" || { echo "OWNER18: verifier is no longer the owner-approved lock"; exit 1; }
          test "$(git hash-object .github/CODEOWNERS)" = "ab715d1a6098d0e0c1c5319aea7eb44d1539cec0" || { echo "OWNER18: codeowners is no longer the owner-approved lock"; exit 1; }
          python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
      - name: Block altered or deleted locked panel image assets
        env:
          GITHUB_BASE_SHA: ${{ github.event.before }}
        run: python3 panel-mosaic-lab/verify-immutable-assets.py
      - name: Enforce FINAL overhead UPD-0012 lock
        run: |
          echo "283a3946ace19799284eb0f79dc924f744d661c4b6a1865932252f8ef29fd90f  panel-mosaic-lab/verify-final-overhead.py" | sha256sum --check --status
          python3 panel-mosaic-lab/verify-final-overhead.py
      - name: Verify interactive overhead lights and controls
        run: |
          node panel-mosaic-lab/interactive-overhead/test.cjs
          node panel-mosaic-lab/interactive-overhead/rotary-guards.test.cjs
          node panel-mosaic-lab/interactive-overhead/no-old-guards.test.cjs
          node panel-mosaic-lab/cockpit/no-old-guards.test.cjs
          node panel-mosaic-lab/interactive-overhead/lights.test.cjs
          node panel-mosaic-lab/lights-test/phase1-geometry-audit.test.cjs
          node panel-mosaic-lab/lights-test/photo-pixel-registration.test.cjs
          node panel-mosaic-lab/lights-test/precision-faces.test.cjs
          node panel-mosaic-lab/lights-test/precision-faces-batch2.test.cjs
          node panel-mosaic-lab/lights-test/photo-pixel-registration-v2.test.cjs
          node panel-mosaic-lab/lights-test/photo-pixel-registration-v3.test.cjs
          node panel-mosaic-lab/lights-test/photo-pixel-registration-v4.test.cjs
          node panel-mosaic-lab/lights-test/photo-pixel-registration-v5.test.cjs
          node panel-mosaic-lab/lights-test/instance-faces.test.cjs
          node panel-mosaic-lab/lights-test/readability-derivatives.test.cjs
          node panel-mosaic-lab/lights-test/main-typography.test.cjs

          node panel-mosaic-lab/lights-test/oh22-profile-faces.test.cjs
          node panel-mosaic-lab/lights-test/oh21-pack-face.test.cjs
          node panel-mosaic-lab/lights-test/atlas-stage-adapter.test.cjs
      - name: Verify unified cockpit assembly
        run: |
          node panel-mosaic-lab/cockpit/flap-lever-model.test.cjs
          node --check panel-mosaic-lab/cockpit/flap-lever-test.js
          node --check panel-mosaic-lab/cockpit/flap-lever-model.js
          node panel-mosaic-lab/cockpit/ac-dc-metering.test.cjs
          node panel-mosaic-lab/cockpit/drive-amps-needle.test.cjs
          node panel-mosaic-lab/cockpit/apu-egt-needle.test.cjs
          node panel-mosaic-lab/cockpit/cabin-dual-needles.test.cjs
          node panel-mosaic-lab/cockpit/cabin-rate-needle.test.cjs
          node panel-mosaic-lab/cockpit/cabin-temperature-needle.test.cjs
          node panel-mosaic-lab/cockpit/duct-pressure-needles.test.cjs
          node panel-mosaic-lab/cockpit/oxygen-pressure-gauge.test.cjs
          node panel-mosaic-lab/cockpit/airspeed-pointers.test.cjs
          node panel-mosaic-lab/cockpit/flight-needles.test.cjs
          node panel-mosaic-lab/cockpit/flap-needles.test.cjs
          node panel-mosaic-lab/cockpit/fuel-temperature-needle.test.cjs
          node panel-mosaic-lab/cockpit/performance.test.cjs
          node panel-mosaic-lab/cockpit/test.cjs

          node panel-mosaic-lab/cockpit/unified-annunciators.test.cjs
          node panel-mosaic-lab/cockpit/lights.test.cjs
          node tests/aircraft-profile-v1.test.cjs
          node tests/isn-electrical-pack-v1.test.cjs
          node tests/isn-engine-apu-v1.test.cjs
          node tests/isn-start-sequence-v1.test.cjs
          node tests/isn-start-fcom-rules-v1.test.cjs
          node tests/isn-apu-start-chain-v1.test.cjs
          node tests/isn-engine-start-dynamics-v1.test.cjs
          node tests/isn-engine-envelope-v1.test.cjs
          node tests/isn-start-abnormal-scenarios-v1.test.cjs
          node tests/isn-start-abnormal-scenarios-v2.test.cjs
          node tests/isn-start-indications-v1.test.cjs
          node tests/isn-cold-dark-two-engine.e2e.test.cjs
          node panel-mosaic-lab/cockpit/engine-start-levers.test.cjs
          node --check panel-mosaic-lab/cockpit/engine-start-levers.js
          node --check isn-start-sequence-lab/app.js
          node tests/isn-cockpit-bridge-v1.test.cjs
          node tests/isn-overhead-transport-v1.test.cjs
          node --check panel-mosaic-lab/cockpit/isn-cockpit.js
          node --check panel-mosaic-lab/cockpit/overhead-bridge.js
          node --check isn-electrical-pack-lab/app.js
          node tools/build-isn-standalone.mjs
          git diff --exit-code -- isn-electrical-pack-lab/standalone.html
          node panel-mosaic-lab/cockpit/cdu.test.cjs
      - name: Verify demo scripts and model
        run: npm test
      - name: Protect standalone CDU from private Stage5/Stage6 routing
        run: |
          node cdu-standalone-v6/tests/stage6-selector.test.cjs
          node cdu-standalone-v6/tests/stage6-public-isolation.test.cjs
          node cdu-standalone-v6/tests/route-field-consistency.test.cjs
      - name: Syntax-check animated panel
        run: node --check main-panel-lab/panel.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
