name: Deploy B737 cockpit prototype to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify demo scripts and model
        run: npm test
      - name: Protect standalone CDU from private Stage5/Stage6 routing
        run: |
          node cdu-standalone-v6/tests/stage6-selector.test.cjs
          node cdu-standalone-v6/tests/stage6-public-isolation.test.cjs
          node cdu-standalone-v6/tests/route-field-consistency.test.cjs
      - name: Syntax-check animated panel
        run: node --check main-panel-lab/panel.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4