name: OH19 Cabin Altitude Photo Anchors
on:
  pull_request:
    branches: [main]
    paths:
      - 'engine/instruments/oh19-cab-alt-*'
      - 'engine/instruments/oh19-native-ticks-batch1.json'
      - 'engine/instruments/oh19-photo-*.js'
      - 'engine/instruments/oh19-photo-*.cjs'
      - 'engine/instruments/oh19-source-pixel-intensity-v2.py'
      - 'engine/instruments/oh19-needle-tip-fit-v1.py'
      - 'engine/instruments/cold-dark-needle-fit-audit-v1.json'
      - 'panel-mosaic-lab/cockpit/cabin-dual-needles*'
      - '.github/workflows/oh19-cab-alt-photo-qa.yml'
  push:
    branches: [main]
    paths:
      - 'engine/instruments/oh19-cab-alt-*'
      - 'engine/instruments/oh19-native-ticks-batch1.json'
      - 'engine/instruments/oh19-photo-*.js'
      - 'engine/instruments/oh19-photo-*.cjs'
      - 'engine/instruments/oh19-source-pixel-intensity-v2.py'
      - 'engine/instruments/oh19-needle-tip-fit-v1.py'
      - 'engine/instruments/cold-dark-needle-fit-audit-v1.json'
      - 'panel-mosaic-lab/cockpit/cabin-dual-needles*'
      - '.github/workflows/oh19-cab-alt-photo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pixel-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen Overhead Verification
        run: python3 panel-mosaic-lab/verify-final-overhead.py
      - name: Native OH19 Source SHA-256
        run: echo "4c667d96ea7652e52784f5c06ee3cdde0879ca37631abf19969861afecc45fed  panel-mosaic-lab/assets/locked/2026-10-23/OH19-PRESS-DIFF-ALT-HORN-d6719ce57cef.png" | sha256sum -c -
      - name: Cabin gauge geometry and scale tests
        run: |
          node panel-mosaic-lab/cockpit/cabin-dual-needles.test.cjs
          node engine/instruments/oh19-cab-alt-54-gauge-qa-v1.test.cjs
          node --test engine/instruments/oh19-photo-evidence-v2.test.cjs
          node engine/instruments/gauge-visual-audit-v1.test.cjs
          node engine/instruments/cold-dark-indicator-v1.test.cjs
          node tests/cabin-field-elevation-v1.test.cjs
      - name: Generate original photo OH19 pixel-contact overlays (QA only)
        run: node engine/instruments/oh19-photo-overlay-v2.cjs
      - name: Decode source-native 98 positions and measure RGB stroke contrast
        run: |
          python3 -m pip install --quiet pillow
          python3 -m py_compile engine/instruments/oh19-source-pixel-intensity-v2.py
          python3 engine/instruments/oh19-source-pixel-intensity-v2.py
          python3 engine/instruments/oh19-needle-tip-fit-v1.py
      - name: Upload OH19 original-image coordinate evidence
        uses: actions/upload-artifact@v4
        with:
          name: OH19-native-photo-candidate-overlays
          path: artifacts/oh19-pixel-qa/
          retention-days: 30
          if-no-files-found: error
      - name: Syntax and locked pixel originals
        run: |
          node --check panel-mosaic-lab/cockpit/cabin-dual-needles-model.js
          node --check panel-mosaic-lab/cockpit/cabin-dual-needles-unified.js
          node --check engine/instruments/oh19-photo-evidence-v2.js
          node --check engine/instruments/oh19-photo-overlay-v2.cjs
