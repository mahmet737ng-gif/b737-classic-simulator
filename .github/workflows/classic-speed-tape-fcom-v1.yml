name: B737 Classic Speed Tape FCOM V1
on:
  push:
    branches: [main]
    paths:
      - 'engine/afds/classic-speed-limit-ch4-v1.js'
      - 'engine/afds/classic-speed-limit-ch4-v1.test.cjs'
      - 'engine/afds/mcp-speed-limit-ch4-integration.test.cjs'
      - 'engine/afds/mcp-mode-core-v1.js'
      - 'panel-mosaic-lab/cockpit/mcp-afds-bridge-v1.js'
      - 'panel-mosaic-lab/cockpit/mcp-independent-digits-v1.js'
      - 'engine/efis/classic-speed-tape-engine-v1.js'
      - 'engine/efis/classic-speed-tape-engine-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/eadi-speed-tape-v1.js'
      - 'panel-mosaic-lab/cockpit/speed-tape-unified-training-v1.js'
      - 'panel-mosaic-lab/cockpit/speed-tape-unified-training-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/index.html'
      - '.github/workflows/classic-speed-tape-fcom-v1.yml'
  workflow_dispatch:
jobs:
  speed-tape-fcom-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validate flight-data and renderer
        run: |
          node --check engine/afds/classic-speed-limit-ch4-v1.js
          node --check engine/afds/mcp-mode-core-v1.js
          node --check panel-mosaic-lab/cockpit/mcp-afds-bridge-v1.js
          node --check panel-mosaic-lab/cockpit/mcp-independent-digits-v1.js
          node --check engine/efis/classic-speed-tape-engine-v1.js
          node --check panel-mosaic-lab/cockpit/eadi-speed-tape-v1.js
          node --check panel-mosaic-lab/cockpit/speed-tape-unified-training-v1.js
          node --check engine/efis/classic-speed-tape-engine-v1.test.cjs
      - name: FCOM speed tape and Unified integration assertions
        run: |
          node engine/afds/classic-speed-limit-ch4-v1.test.cjs
          node engine/afds/mcp-speed-limit-ch4-integration.test.cjs
          node engine/efis/classic-speed-tape-engine-v1.test.cjs
          node panel-mosaic-lab/cockpit/speed-tape-unified-training-v1.test.cjs
      - name: Confirm EADI scripts installed
        run: |
          grep -Fq 'engine/efis/classic-speed-tape-engine-v1.js' panel-mosaic-lab/cockpit/index.html
          grep -Fq 'eadi-speed-tape-v1.js' panel-mosaic-lab/cockpit/index.html
          grep -Fq 'classic-speed-limit-ch4-v1.js' panel-mosaic-lab/cockpit/index.html
