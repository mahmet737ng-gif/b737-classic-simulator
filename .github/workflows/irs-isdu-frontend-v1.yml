name: IRS ISDU front-end source and lock QA
on:
  push:
    paths:
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'panel-mosaic-lab/cockpit/irs-isdu-frontend-v1.js'
      - 'panel-mosaic-lab/cockpit/irs-isdu-frontend-v1.css'
      - 'panel-mosaic-lab/cockpit/assets/irs-honeywell-fcom-keypad.svg'
      - 'panel-mosaic-lab/cockpit/irs-isdu-frontend-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/irs-isdu-onpanel-v2.js'
      - 'panel-mosaic-lab/cockpit/irs-isdu-onpanel-v2.css'
      - 'panel-mosaic-lab/cockpit/irs-isdu-onpanel-v2.test.cjs'
      - 'panel-mosaic-lab/cockpit/irs-isdu-cues-v1.js'
      - 'panel-mosaic-lab/cockpit/irs-isdu-cues-v1.css'
      - 'panel-mosaic-lab/cockpit/irs-isdu-cues-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/irs-isdu-global-test-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/irs-sys-dspl-v1.js'
      - 'panel-mosaic-lab/cockpit/irs-sys-dspl-v1.css'
      - 'panel-mosaic-lab/cockpit/irs-sys-dspl-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/irs-sys-dspl-lr-markings-v1.js'
      - 'panel-mosaic-lab/cockpit/irs-sys-dspl-lr-markings-v1.css'
      - 'panel-mosaic-lab/cockpit/irs-sys-dspl-lr-markings-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/irs-dspl-sel-upper-v1.js'
      - 'panel-mosaic-lab/cockpit/irs-dspl-sel-upper-v1.css'
      - 'panel-mosaic-lab/cockpit/irs-dspl-sel-upper-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/irs-upper-face-v2.js'
      - 'panel-mosaic-lab/cockpit/irs-upper-face-v2.css'
      - 'panel-mosaic-lab/cockpit/irs-upper-face-v2.test.cjs'
      - 'panel-mosaic-lab/cockpit/assets/irs-upper-outer-photo-v2.avif'
      - 'panel-mosaic-lab/cockpit/assets/irs-upper-inner-photo-v2.avif'
      - 'panel-mosaic-lab/cockpit/assets/irs-upper-old-text-clean-v2.avif'
      - 'panel-mosaic-lab/cockpit/assets/irs-upper-mode-labels-v2.svg'
      - 'panel-mosaic-lab/cockpit/assets/irs-dspl-sel-outer-v1.svg'
      - 'panel-mosaic-lab/cockpit/assets/irs-dspl-sel-inner-brt-v1.svg'
      - 'panel-mosaic-lab/cockpit/irs-sys-dspl-owner-lock-v1.json'
      - 'panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py'
      - 'panel-mosaic-lab/cockpit/assets/irs-sys-dspl-lr-markings-v1.svg'
      - 'panel-mosaic-lab/cockpit/assets/irs-sys-dspl-selector-approved-v1.avif'
      - 'panel-mosaic-lab/cockpit/assets/irs-isdu-white-cue-on-v1.svg'
      - 'panel-mosaic-lab/cockpit/assets/irs-honeywell-fcom-keypad.avif'
      - 'panel-mosaic-lab/cockpit/assets/irs-owner-keycaps-v3.avif'
      - '.github/workflows/irs-isdu-frontend-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  irs-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail-closed OWNER LOCK for approved lower IRS SYS DSPL L/R selector
        run: |
          test "$(git hash-object panel-mosaic-lab/cockpit/irs-sys-dspl-owner-lock-v1.json)" = "9a8ea6f179fe3bc3f826051f06b402c5d8b5e5fc" || { echo "IRS SYS DSPL owner manifest modification denied"; exit 1; }
          test "$(git hash-object panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py)" = "f43f8540774f10233d455d28d4c15a2f38af8b25" || { echo "IRS SYS DSPL lock verifier modification denied"; exit 1; }
          python3 panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py
      - name: Lint IRS frontend
        run: |
          node --check panel-mosaic-lab/cockpit/irs-isdu-frontend-v1.js
          node --check panel-mosaic-lab/cockpit/irs-isdu-onpanel-v2.js
          node --check panel-mosaic-lab/cockpit/irs-isdu-cues-v1.js
          node --check panel-mosaic-lab/cockpit/irs-sys-dspl-v1.js
          node --check panel-mosaic-lab/cockpit/irs-sys-dspl-lr-markings-v1.js
          node --check panel-mosaic-lab/cockpit/irs-dspl-sel-upper-v1.js
          node --check panel-mosaic-lab/cockpit/irs-upper-face-v2.js
      - name: Verify actual Honeywell keypad source and browser mount
        run: |
          node panel-mosaic-lab/cockpit/irs-isdu-frontend-v1.test.cjs
          node panel-mosaic-lab/cockpit/irs-isdu-onpanel-v2.test.cjs
          node panel-mosaic-lab/cockpit/irs-isdu-cues-v1.test.cjs
          node panel-mosaic-lab/cockpit/irs-isdu-global-test-v1.test.cjs
          node panel-mosaic-lab/cockpit/irs-sys-dspl-v1.test.cjs
          node panel-mosaic-lab/cockpit/irs-sys-dspl-lr-markings-v1.test.cjs
          node panel-mosaic-lab/cockpit/irs-dspl-sel-upper-v1.test.cjs
          node panel-mosaic-lab/cockpit/irs-upper-face-v2.test.cjs
      - name: Enforce frozen overhead
        run: python3 panel-mosaic-lab/verify-final-overhead.py
      - name: Enforce immutable owner18 guarded switches
        run: python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test