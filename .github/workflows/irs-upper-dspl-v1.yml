name: IRS upper coaxial DSPL SEL and BRT QA
on:
  push:
    paths: ['panel-mosaic-lab/cockpit/irs-upper-*', 'panel-mosaic-lab/cockpit/irs-rotary-detent-indices-v1.*', 'panel-mosaic-lab/cockpit/irs-background-hash-clean-v1.*', 'panel-mosaic-lab/cockpit/assets/irs-upper-*', 'panel-mosaic-lab/cockpit/index.html', '.github/workflows/irs-upper-dspl-v1.yml']
  pull_request:
    paths: ['panel-mosaic-lab/cockpit/irs-upper-*', 'panel-mosaic-lab/cockpit/irs-rotary-detent-indices-v1.*', 'panel-mosaic-lab/cockpit/irs-background-hash-clean-v1.*', 'panel-mosaic-lab/cockpit/assets/irs-upper-*', 'panel-mosaic-lab/cockpit/index.html', '.github/workflows/irs-upper-dspl-v1.yml']
jobs:
  independent-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check panel-mosaic-lab/cockpit/irs-upper-dspl-v1.js
      - run: node --test panel-mosaic-lab/cockpit/irs-upper-dspl-v1.test.cjs
      - run: node --check panel-mosaic-lab/cockpit/irs-rotary-detent-indices-v1.js
      - run: node --test panel-mosaic-lab/cockpit/irs-rotary-detent-indices-v1.test.cjs
      - run: node --check panel-mosaic-lab/cockpit/irs-background-hash-clean-v1.js
      - run: node --test panel-mosaic-lab/cockpit/irs-background-hash-clean-v1.test.cjs
      - run: python3 panel-mosaic-lab/verify-final-overhead.py
      - run: python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
      - run: python3 panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py
