name: B737 Unified Engine EIS and Conventional Live QA
on:
  push:
    branches: [main]
    paths:
      - "engine/instruments/engine-indication-backend-v1.js"
      - "engine/instruments/engine-indication-technical-db-v1.json"
      - "engine/systems/classic-engine-start-logic-v2.js"
      - "engine/integration/isn-apu-start-chain-v1.js"
      - "engine/integration/isn-unified-control-router-v1.js"
      - "panel-mosaic-lab/cockpit/isn-cockpit.js"
      - "panel-mosaic-lab/cockpit/isn-cockpit.css"
      - "tests/unified-physical-start-ack-v1.test.cjs"
      - "tests/isn-unified-ecu-physical-v1.test.cjs"
      - "panel-mosaic-lab/cockpit/engine-indication-live-v2.js"
      - "panel-mosaic-lab/cockpit/index.html"
      - "panel-mosaic-lab/engine-test-lab/**"
      - "tests/engine-indication-unified-live-v2.test.cjs"
      - "tests/engine-start-crossbleed-ignition-v2.test.cjs"
      - ".github/workflows/engine-indication-unified-live-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Unified engine front/backend integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source-indexed engine and frontend E2E
        run: |
          node tests/engine-indication-tech-db-v1.test.cjs
          node tests/engine-indication-unified-live-v2.test.cjs
          node tests/engine-start-crossbleed-ignition-v2.test.cjs
          node tests/isn-start-fcom-rules-v1.test.cjs
          node tests/isn-ecu-realtime-start-v1.test.cjs
          node tests/isn-unified-ecu-physical-v1.test.cjs
          node tests/unified-physical-start-ack-v1.test.cjs
      - name: Engine runtime and lab JS parse
        run: |
          node --check panel-mosaic-lab/cockpit/engine-indication-live-v2.js
          node --check panel-mosaic-lab/engine-test-lab/app.js
          node --check engine/systems/classic-engine-start-logic-v2.js
          node --check engine/integration/isn-apu-start-chain-v1.js
          node --check engine/integration/isn-unified-control-router-v1.js
          node --check panel-mosaic-lab/cockpit/isn-cockpit.js
      - name: Preserve locked overhead imagery
        run: python3 panel-mosaic-lab/verify-final-overhead.py
