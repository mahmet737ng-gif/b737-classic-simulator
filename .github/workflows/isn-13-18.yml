name: ISN 13–18 Engine Testbench QA
on:
  push:
    branches: [main]
    paths:
      - 'engine/integration/isn-13-18-ecu-testbench-v1.js'
      - 'engine/integration/isn-engine-start-dynamics-v1.js'
      - 'engine/integration/isn-apu-load-dynamics-v1.js'
      - 'engine/integration/isn-09-12-runtime-v1.js'
      - 'engine/integration/isn-apu-start-chain-v1.js'
      - 'engine/integration/isn-thrust-performance-v1.js'
      - 'isn-ecu-start-lab/**'
      - 'tests/isn-13-18-ecu.test.cjs'
      - 'tests/isn-start-spool-calibration-v2.test.cjs'
      - 'tests/isn-apu-electrical-load-v1.test.cjs'
      - 'tests/isn-engine-envelope-v1.test.cjs'
      - '.github/workflows/isn-13-18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect locked overhead
        run: python3 panel-mosaic-lab/verify-final-overhead.py
      - name: Lint new code
        run: |
          node --check engine/integration/isn-13-18-ecu-testbench-v1.js
          node --check isn-ecu-start-lab/app.js
      - name: Engine start and ECU testbench E2E
        run: |
          node tests/isn-13-18-ecu.test.cjs
          node tests/isn-start-spool-calibration-v2.test.cjs
          node tests/isn-apu-electrical-load-v1.test.cjs
          node tests/isn-09-12-integration.test.cjs
          node tests/isn-engine-envelope-v1.test.cjs
          node tests/isn-start-abnormal-scenarios-v2.test.cjs
