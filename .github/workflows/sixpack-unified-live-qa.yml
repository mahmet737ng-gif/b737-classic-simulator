name: Unified Six-Pack — Live Recall Integration QA
on:
  push:
    paths:
      - 'panel-mosaic-lab/cockpit/sixpack-glareshield-v1.js'
      - 'panel-mosaic-lab/cockpit/sixpack-live-integration-v1.js'
      - 'panel-mosaic-lab/cockpit/sixpack-live-unified.test.cjs'
      - 'panel-mosaic-lab/cockpit/fire-lights-unified.js'
      - 'panel-mosaic-lab/cockpit/tat-probe-unified-v1.js'
      - 'panel-mosaic-lab/cockpit/pressurization-oh22.js'
      - 'panel-mosaic-lab/cockpit/aircon-400-overlay.js'
      - '.github/workflows/sixpack-unified-live-qa.yml'
  pull_request:
    paths:
      - 'panel-mosaic-lab/cockpit/sixpack-glareshield-v1.js'
      - 'panel-mosaic-lab/cockpit/sixpack-live-integration-v1.js'
      - 'panel-mosaic-lab/cockpit/sixpack-live-unified.test.cjs'
      - 'panel-mosaic-lab/cockpit/fire-lights-unified.js'
      - 'panel-mosaic-lab/cockpit/tat-probe-unified-v1.js'
      - 'panel-mosaic-lab/cockpit/pressurization-oh22.js'
      - 'panel-mosaic-lab/cockpit/aircon-400-overlay.js'
      - '.github/workflows/sixpack-unified-live-qa.yml'
  workflow_dispatch:
jobs:
  annunciator-recall:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check panel-mosaic-lab/cockpit/sixpack-glareshield-v1.js
          node --check panel-mosaic-lab/cockpit/sixpack-live-integration-v1.js
          node --check panel-mosaic-lab/cockpit/fire-lights-unified.js
          node --check panel-mosaic-lab/cockpit/tat-probe-unified-v1.js
          node --check panel-mosaic-lab/cockpit/pressurization-oh22.js
          node --check panel-mosaic-lab/cockpit/aircon-400-overlay.js
      - name: Integration tests - 4096 combinations, acknowledge, recall, electrical, fire
        run: node --test panel-mosaic-lab/cockpit/sixpack-live-unified.test.cjs
