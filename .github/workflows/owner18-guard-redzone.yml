name: Owner18 RED ZONE — Immutable Guarded Switches
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redzone:
    name: owner18-redzone-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned owner's 18 final guards / engine database / locked photos
        run: |
          test "$(git hash-object panel-mosaic-lab/cockpit/guard-redzone-lock.json)" = "beb7caa9dd5d888f4135a0b757c181b061c701dc" || { echo "OWNER18 RED ZONE: frozen manifest tampered with"; exit 1; }
          test "$(git hash-object engine/maps/guard-owner18-redzone-v1.json)" = "beb7caa9dd5d888f4135a0b757c181b061c701dc" || { echo "OWNER18 RED ZONE: frozen engine tampered with"; exit 1; }
          test "$(git hash-object panel-mosaic-lab/cockpit/verify-guard-redzone.py)" = "6e4c322fd4297525f7db2a700991f741b5563824" || { echo "OWNER18 RED ZONE: frozen verifier tampered with"; exit 1; }
          test "$(git hash-object .github/CODEOWNERS)" = "ab715d1a6098d0e0c1c5319aea7eb44d1539cec0" || { echo "OWNER18 RED ZONE: frozen codeowners tampered with"; exit 1; }
          python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
      - name: Prove fail-closed gate with a deliberately altered guard in CI sandbox
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          p=Path('panel-mosaic-lab/cockpit/guard-owner18-v1.json')
          original=p.read_bytes()
          try:
              p.write_bytes(original+b'\n')
              trial=subprocess.run(['python3','panel-mosaic-lab/cockpit/verify-guard-redzone.py'],
                                   capture_output=True,text=True)
              if trial.returncode == 0 or 'RED ZONE MODIFICATION BLOCKED' not in trial.stderr:
                  raise SystemExit('DENIED: Guard negative test did not reject a mutated manifest!\n'+trial.stderr)
              print('PASS: deliberate unauthorized guarded-switch file change was BLOCKED')
          finally:
              p.write_bytes(original)
          PY
      - name: Verify restored canonical guarded-switch bytes
        run: python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py
