name: TCAS Encounter Lab geometry and FMA regression
on:
  push:
    paths:
      - 'engine/tcas/**'
      - 'panel-mosaic-lab/cockpit/tcas-photo/**'
      - 'tests/tcas-photo-browser.cjs'
      - 'panel-mosaic-lab/cockpit/tcas-lab/**'
      - '.github/workflows/tcas-encounter-qa.yml'
  pull_request:
    paths:
      - 'engine/tcas/**'
      - 'panel-mosaic-lab/cockpit/tcas-photo/**'
      - 'tests/tcas-photo-browser.cjs'
      - 'panel-mosaic-lab/cockpit/tcas-lab/**'
      - '.github/workflows/tcas-encounter-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tcas-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to validate immutable files against the pinned historical owner commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TCAS JavaScript syntax
        run: |
          node --check engine/tcas/classic-tcas-v1.js
          node --check engine/tcas/classic-tcas-v2.js
          node --check panel-mosaic-lab/cockpit/tcas-lab/app.js
          node --check panel-mosaic-lab/cockpit/tcas-lab/cruise-scenario-v1.js
          node --check panel-mosaic-lab/cockpit/tcas-lab/efis-physical-cp-v1.js
          node --check panel-mosaic-lab/cockpit/tcas-lab/browser-smoke.cjs
          node --check efis-display-lab/ehsi-v2.js
          node --check panel-mosaic-lab/cockpit/tcas-lab/tcas-regression.test.cjs
      - name: Kinematics, manual RA response and layout
        run: node --test panel-mosaic-lab/cockpit/tcas-lab/tcas-regression.test.cjs
      - name: Protect existing approved cockpit assets
        run: |
          python3 panel-mosaic-lab/verify-final-overhead.py
          python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
          python3 panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py
          python3 panel-mosaic-lab/cockpit/verify-irs-13seg-owner-lock-v1.py --negative-self-test

  browser-smoke:
    needs: tcas-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install --with-deps chromium; fi
      - name: Inspect real physical EFIS photo, knobs and EHSI rendering
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          node panel-mosaic-lab/cockpit/tcas-lab/browser-smoke.cjs
      - name: Verify installed raster transponder and both selectable vertical speed indicators
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          python3 -m http.server 8754 --bind 127.0.0.1 >/tmp/tcas-http.log 2>&1 &
          node tests/tcas-photo-browser.cjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcas-lab-approved-efis-control-panel
          path: artifacts/tcas-lab/*.png
          if-no-files-found: ignore
