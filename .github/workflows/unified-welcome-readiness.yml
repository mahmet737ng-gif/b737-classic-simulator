name: Unified Welcome main-panel readiness gate
on:
  pull_request:
    paths:
      - '.github/workflows/unified-welcome-readiness.yml'
      - 'panel-mosaic-lab/cockpit/unified-welcome-v1.js'
      - 'panel-mosaic-lab/cockpit/unified-welcome-readiness-v2.js'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'tests/unified-welcome-readiness-v2.test.cjs'
  push:
    branches: [main]
    paths:
      - 'panel-mosaic-lab/cockpit/unified-welcome-v1.js'
      - 'panel-mosaic-lab/cockpit/unified-welcome-readiness-v2.js'
      - 'panel-mosaic-lab/cockpit/index.html'
jobs:
  welcome-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check panel-mosaic-lab/cockpit/unified-welcome-v1.js
          node --check panel-mosaic-lab/cockpit/unified-welcome-readiness-v2.js
      - name: Assert 70 percent + fully initialized main + FLT PHASE repaint
        run: node --test tests/unified-welcome-readiness-v2.test.cjs tests/flight-phase-shell-v1.test.cjs
