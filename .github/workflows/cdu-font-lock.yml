name: CDU typography lock
on:
  push:
  pull_request:
jobs:
  test-approved-cdu-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original CDU fonts and global integration
        run: node tests/cdu-font-lock.test.cjs
