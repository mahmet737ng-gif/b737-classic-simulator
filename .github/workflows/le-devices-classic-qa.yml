name: LE DEVICES Classic scenario QA
on:
  push:
    paths:
      - 'engine/systems/le-devices-classic-v1.js'
      - 'engine/systems/te-flap-actuator-v1.js'
      - 'tests/te-flap-actuator-v1.test.cjs'
      - 'tests/le-devices-classic-v1.test.cjs'
      - 'panel-mosaic-lab/le-devices/trainer-bridge-v1.js'
      - 'panel-mosaic-lab/cockpit/le-devices-live-link-v1.js'
      - 'panel-mosaic-lab/cockpit/lights-model.js'
      - 'panel-mosaic-lab/le-devices/panel.js'
      - 'tests/le-devices-classic-bridge.test.cjs'
      - 'tests/le-devices-unified-link.test.cjs'
      - 'tests/le-devices-forward-light-model.test.cjs'
      - '.github/workflows/le-devices-classic-qa.yml'
  pull_request:
    paths:
      - 'engine/systems/le-devices-classic-v1.js'
      - 'tests/le-devices-classic-v1.test.cjs'
      - 'panel-mosaic-lab/le-devices/trainer-bridge-v1.js'
      - 'panel-mosaic-lab/cockpit/le-devices-live-link-v1.js'
      - 'panel-mosaic-lab/cockpit/lights-model.js'
      - 'panel-mosaic-lab/le-devices/panel.js'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine/systems/le-devices-classic-v1.js
      - run: node --check engine/systems/te-flap-actuator-v1.js
      - run: node --check panel-mosaic-lab/le-devices/trainer-bridge-v1.js
      - run: node --check panel-mosaic-lab/cockpit/le-devices-live-link-v1.js
      - run: node --test tests/te-flap-actuator-v1.test.cjs tests/le-devices-classic-v1.test.cjs tests/le-devices-classic-bridge.test.cjs tests/le-devices-unified-link.test.cjs tests/le-devices-forward-light-model.test.cjs panel-mosaic-lab/le-devices/panel.test.cjs
