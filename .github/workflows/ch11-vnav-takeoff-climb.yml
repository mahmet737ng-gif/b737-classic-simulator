name: Chapter 11 Takeoff and Climb VNAV source QA
on:
  push:
  pull_request:
jobs:
  vnav-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate climb source contract
        run: node engine/ch11/tests/vnav-takeoff-climb-2022.test.cjs
      - name: Preserve CDU fonts
        run: node tests/cdu-font-lock.test.cjs
