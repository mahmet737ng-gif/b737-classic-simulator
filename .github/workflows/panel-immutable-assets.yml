name: B737 Locked Panel Images — SHA-256 Audit
on:
  push:
    branches: [main]
    paths:
      - 'panel-mosaic-lab/assets/locked/**'
      - 'panel-mosaic-lab/immutable-manifest.json'
      - 'panel-mosaic-lab/verify-immutable-assets.py'
      - '.github/workflows/panel-immutable-assets.yml'
  pull_request:
    paths:
      - 'panel-mosaic-lab/assets/locked/**'
      - 'panel-mosaic-lab/immutable-manifest.json'
      - 'panel-mosaic-lab/verify-immutable-assets.py'
      - '.github/workflows/panel-immutable-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify SHA-256 and immutable file history
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${PR_BASE_SHA}" ]; then
            export GITHUB_BASE_SHA="${PR_BASE_SHA}"
          elif [ -n "${PUSH_BASE_SHA}" ]; then
            export GITHUB_BASE_SHA="${PUSH_BASE_SHA}"
          fi
          python3 panel-mosaic-lab/verify-immutable-assets.py
