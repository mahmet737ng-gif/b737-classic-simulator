name: CDU SG shared private source QA
on:
  push:
    branches: [main]
    paths:
      - 'cdu-standalone-v6/cdu-sg-selector-v1.js'
      - 'cdu-standalone-v6/app.js'
      - 'panel-mosaic-lab/cockpit/cdu-sg-*'
      - 'panel-mosaic-lab/cockpit/tests/cdu-sg-private-integration-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/cdu-stage.html'
      - 'panel-mosaic-lab/cockpit/cdu-session.js'
      - 'panel-mosaic-lab/cockpit/ehsi-unified-v1.js'
      - 'panel-mosaic-lab/cockpit/flight-scenario-panel-v1.js'
      - 'panel-mosaic-lab/cockpit/irs-trainer-unified-v1.js'
      - 'panel-mosaic-lab/cockpit/flight-phase-position-bridge-v1.js'
      - 'engine/flight/iran-nav-reference-v1.js'
      - 'panel-mosaic-lab/cockpit/cdu-irs-adapter-v1.js'
      - 'engine/flight/flight-location-reference-v1.js'
      - 'tests/flight-location-reference-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/app.js'
      - 'panel-mosaic-lab/cockpit/index.html'
      - '.github/workflows/cdu-sg-private-integration-v1.yml'
  pull_request:
    paths:
      - 'engine/fmc/sg-source-geometry-v1.js'
      - 'cdu-standalone-v6/cdu-sg-selector-v1.js'
      - 'panel-mosaic-lab/cockpit/cdu-sg-*'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'tests/sg-source-geometry-v1.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cdu-sg-reference-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check panel-mosaic-lab/cockpit/cdu-sg-route-state-v1.js
          node --check panel-mosaic-lab/cockpit/cdu-sg-public-connect-v1.js
          node --check panel-mosaic-lab/cockpit/cdu-sg-ehsi-preview-v1.js
          node --check engine/fmc/sg-source-geometry-v1.js
          node --check cdu-standalone-v6/cdu-sg-selector-v1.js
          node --check cdu-standalone-v6/app.js
          node --check panel-mosaic-lab/cockpit/app.js
          node --check panel-mosaic-lab/cockpit/cdu-session.js
          node --check panel-mosaic-lab/cockpit/ehsi-unified-v1.js
          node --check engine/flight/flight-location-reference-v1.js
          node --check panel-mosaic-lab/cockpit/flight-scenario-panel-v1.js
          node --check panel-mosaic-lab/cockpit/irs-trainer-unified-v1.js
          node --check panel-mosaic-lab/cockpit/flight-phase-position-bridge-v1.js
          node --check engine/flight/iran-nav-reference-v1.js
          node --check panel-mosaic-lab/cockpit/cdu-irs-adapter-v1.js
      - run: |
          node --test tests/sg-source-geometry-v1.test.cjs
          node --test tests/flight-location-reference-v1.test.cjs
          node --test panel-mosaic-lab/cockpit/tests/cdu-sg-private-integration-v1.test.cjs
          node --test cdu-standalone-v6/tests/dep-arr-fcom-114032.test.cjs
          node panel-mosaic-lab/cockpit/cdu-session.test.cjs
          node --test cdu-standalone-v6/tests/stage6-public-bridge-v1.test.cjs
