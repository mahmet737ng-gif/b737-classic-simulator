name: 737-400 OH21 variant QA
on:
  push:
    branches: [main]
    paths:
      - "panel-mosaic-lab/cockpit/aircon-400-oh21-*"
      - "panel-mosaic-lab/cockpit/assets/737-400-PACK_*"
      - "panel-mosaic-lab/cockpit/overhead-stage.html"
      - "panel-mosaic-lab/interactive-overhead/lights*.js"
      - "engine/systems/pneumatics-v6.js"
      - "tests/aircon-400-oh21-variant.test.cjs"
      - ".github/workflows/aircon-400-oh21-variant-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JS modules
        run: |
          node --check engine/systems/pneumatics-v6.js
          node --check panel-mosaic-lab/interactive-overhead/lights-model.js
          node --check panel-mosaic-lab/interactive-overhead/lights.js
          node --check panel-mosaic-lab/cockpit/aircon-400-oh21-model.js
          node --check panel-mosaic-lab/cockpit/aircon-400-oh21-overlay.js
      - name: Test both aircraft families and dual recirculation
        run: |
          node tests/pneumatics-v6.test.cjs
          node tests/aircon-400-oh21-variant.test.cjs
          node panel-mosaic-lab/interactive-overhead/lights.test.cjs
      - name: Verify frozen final overhead is unchanged
        run: python3 panel-mosaic-lab/verify-final-overhead.py
