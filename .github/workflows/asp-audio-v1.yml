name: ASP Audio NORM ALT source and CB quarantine QA
on:
  push:
    branches: [main]
    paths:
      - 'engine/systems/asp-audio-v1.js'
      - 'panel-mosaic-lab/cockpit/asp-audio-runtime-v1.js'
      - 'panel-mosaic-lab/cockpit/asp-controls-v1.js'
      - 'panel-mosaic-lab/cockpit/asp-socket-registration-v2.js'
      - 'panel-mosaic-lab/cockpit/asp-socket-registration-v2.test.cjs'
      - 'panel-mosaic-lab/cockpit/asp-observer-overhead-v3.js'
      - 'panel-mosaic-lab/cockpit/asp-observer-parent-bridge-v3.js'
      - 'panel-mosaic-lab/cockpit/asp-observer-overhead-v3.test.cjs'
      - 'panel-mosaic-lab/cockpit/overhead-stage.html'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'panel-mosaic-lab/cockpit/asp-alpha-reference-v2.py'
      - 'panel-mosaic-lab/cockpit/asp-socket-registration-v2.js'
      - 'panel-mosaic-lab/cockpit/asp-controls-v1.js'
      - 'panel-mosaic-lab/cockpit/asp-observer-overhead-v3.js'
      - 'panel-mosaic-lab/cockpit/overhead-stage.html'
      - 'tests/asp-audio-v1.test.cjs'
      - 'tests/asp-audio-routing-v2.test.cjs'
      - 'tests/asp-physical-controls-v1.test.cjs'
      - 'engine/interaction/asp-physical-commands-v1.js'
      - 'panel-mosaic-lab/cockpit/asp-physical-controls-v1.js'
      - 'panel-mosaic-lab/cockpit/asp-physical-controls-v1.css'
      - 'panel-mosaic-lab/cockpit/overhead-stage.html'
      - 'engine/systems/asp-audio-routing-v2.js'
      - 'engine/integration/asp-electrical-cb-v2.js'
      - 'panel-mosaic-lab/cockpit/asp-audio-routing-live-v2.js'
      - '.github/workflows/asp-audio-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asp-audio-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Javascript syntax
        run: |
          node --check engine/systems/asp-audio-v1.js
          node --check panel-mosaic-lab/cockpit/asp-audio-runtime-v1.js
          node --check engine/systems/asp-audio-routing-v2.js
          node --check engine/integration/asp-electrical-cb-v2.js
          node --check panel-mosaic-lab/cockpit/asp-audio-routing-live-v2.js
          node --check panel-mosaic-lab/cockpit/asp-physical-controls-v1.js
          node --check engine/interaction/asp-physical-commands-v1.js
      - name: FCOM MRG normal alternate independent stations and protected-asset geometry tests
        run: node --test tests/asp-audio-v1.test.cjs
      - name: Audio routing, MRG CB quarantine, RF fault isolation
        run: node --test tests/asp-audio-routing-v2.test.cjs
      - name: Physical PTT spring return / mask boom / OBS overhead bridge
        run: node --test tests/asp-physical-controls-v1.test.cjs
      - name: Existing ASP controls pixel/angle QA
        run: node --test panel-mosaic-lab/cockpit/asp-controls-v1.test.cjs
      - name: Measure exact four owner ASP PNG silhouette centers
        run: python3 panel-mosaic-lab/cockpit/asp-alpha-reference-v2.py
      - name: Pixel-source aperture and actual alpha-center regression (60 controls)
        run: |
          node --check panel-mosaic-lab/cockpit/asp-socket-registration-v2.js
          node --check panel-mosaic-lab/cockpit/asp-controls-v1.js
          node --test panel-mosaic-lab/cockpit/asp-socket-registration-v2.test.cjs
          node --check panel-mosaic-lab/cockpit/asp-observer-overhead-v3.js
          node --check panel-mosaic-lab/cockpit/asp-observer-parent-bridge-v3.js
          node --test panel-mosaic-lab/cockpit/asp-observer-overhead-v3.test.cjs
      - name: Frozen overhead baseline
        run: python3 panel-mosaic-lab/verify-final-overhead.py
      - name: Owner18 guarded switches red zone
        run: python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
      - name: IRS full frontend red zone
        run: python3 panel-mosaic-lab/cockpit/verify-irs-complete-redzone-v1.py --negative-self-test
