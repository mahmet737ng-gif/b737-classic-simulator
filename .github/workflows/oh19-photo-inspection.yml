name: OH19 read-only photo inspection
on:
  push:
    branches: [gauge-photo-calibration-oh19-54-v1]
    paths:
      - 'tools/gauge-oh19-photo-qa.py'
      - 'tools/cabin-altitude-photo-verify-v1.py'
      - 'engine/instruments/cabin-altitude-photo-map-v1.js'
      - 'engine/instruments/cabin-altitude-photo-map-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/cabin-dual-needles-unified.js'
      - 'panel-mosaic-lab/cockpit/cabin-dual-needles.test.cjs'
      - 'engine/instruments/cold-dark-needle-fit-audit-v1.json'
      - '.github/workflows/oh19-photo-inspection.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pillow cairosvg
      - run: node --test engine/instruments/cabin-altitude-photo-map-v1.test.cjs
      - run: node panel-mosaic-lab/cockpit/cabin-dual-needles.test.cjs
      - run: node --check panel-mosaic-lab/cockpit/cabin-dual-needles-unified.js
      - run: python3 tools/cabin-altitude-photo-verify-v1.py
      - run: python3 tools/gauge-source-visual-review.py
      - run: python3 tools/gauge-oh19-photo-qa.py
