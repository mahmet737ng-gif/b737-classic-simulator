name: Flight controls FCOM guard and selector checks
on:
  push:
    paths:
      - 'flight-controls-panel/**'
      - 'tests/fcom-guard-control.test.cjs'
      - 'tests/guarded-switch-phase12-audit.test.cjs'
      - 'engine/maps/guarded-switches-fcom-visual-audit-v1.json'
      - 'docs/GUARDED_SWITCH_PHASE1_PHASE2_AUDIT_2026-10-26.md'
      - '.github/workflows/flight-control-guards.yml'
  pull_request:
    paths:
      - 'flight-controls-panel/**'
      - 'tests/fcom-guard-control.test.cjs'
      - 'tests/guarded-switch-phase12-audit.test.cjs'
      - 'engine/maps/guarded-switches-fcom-visual-audit-v1.json'
      - 'docs/GUARDED_SWITCH_PHASE1_PHASE2_AUDIT_2026-10-26.md'
      - '.github/workflows/flight-control-guards.yml'
  workflow_dispatch:
jobs:
  guard-selector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/fcom-guard-control.test.cjs
      - run: node --test tests/guarded-switch-phase12-audit.test.cjs
      - run: python3 panel-mosaic-lab/verify-final-overhead.py
