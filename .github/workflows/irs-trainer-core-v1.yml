name: IRS dual independent trainer core V1 QA
on:
  push:
    paths:
      - 'engine/systems/irs-trainer-core-v1.cjs'
      - 'engine/systems/irs-trainer-web-v1.js'
      - 'panel-mosaic-lab/cockpit/irs-trainer-unified-v1.js'
      - 'tests/irs-unified-integration-v1.test.cjs'
      - 'tests/cdu-irs-adapter-v1.test.cjs'
      - 'panel-mosaic-lab/cockpit/irs-trainer-unified-v1.css'
      - 'panel-mosaic-lab/cockpit/cdu-irs-adapter-v1.js'
      - 'panel-mosaic-lab/cockpit/cdu-stage.html'
      - 'panel-mosaic-lab/cockpit/index.html'
      - 'tests/irs-trainer-core-v1.test.cjs'
      - 'docs/IRS_TRAINER_ARCHITECTURE_V1.md'
      - 'engine/contracts/irs-hdg-sts-seven-minute-v1.cjs'
      - '.github/workflows/irs-trainer-core-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  irs-trainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run independent L/R IRS procedure and motion tests
        run: |
          node --check engine/systems/irs-trainer-core-v1.cjs
          node --check engine/systems/irs-trainer-web-v1.js
          node --check panel-mosaic-lab/cockpit/irs-trainer-unified-v1.js
          node --check panel-mosaic-lab/cockpit/cdu-irs-adapter-v1.js
          node --check tests/irs-trainer-core-v1.test.cjs
          node tests/irs-trainer-core-v1.test.cjs
          node tests/irs-unified-integration-v1.test.cjs
          node tests/cdu-irs-adapter-v1.test.cjs
          node panel-mosaic-lab/cockpit/irs-hdg-sts-seven-minute-v1.test.cjs
      - name: Protect owner-approved 13-cell display and SYS DSPL selector
        run: |
          python3 panel-mosaic-lab/cockpit/verify-irs-13seg-owner-lock-v1.py --negative-self-test
          python3 panel-mosaic-lab/cockpit/verify-irs-sys-dspl-owner-lock-v1.py
      - name: Protect immutable overhead and 18 guarded switches
        run: |
          python3 panel-mosaic-lab/verify-final-overhead.py
          python3 panel-mosaic-lab/cockpit/verify-guard-redzone.py --negative-self-test
