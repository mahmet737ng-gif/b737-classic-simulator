name: Classic pack-independent start and off-bus generator source meters
on:
  push:
    paths:
      - 'engine/integration/isn-apu-start-chain-v1.js'
      - 'engine/systems/electrical-network-v1.js'
      - 'tests/isn-isolation-start-routing-v1.test.cjs'
      - 'tests/electrical-network-v1.test.cjs'
      - 'tests/classic-pack-gen-source-focused.test.cjs'
      - '.github/workflows/classic-pack-gen-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pack-independent starter air path and isolation routing
        run: node tests/isn-isolation-start-routing-v1.test.cjs
      - name: Generator off-bus source terminals and PACK AUTO/HIGH independent start regression
        run: node tests/classic-pack-gen-source-focused.test.cjs
      - name: Syntax and no hard PACK OFF engine-start interlock
        run: |
          node --check engine/integration/isn-apu-start-chain-v1.js
          node --check engine/systems/electrical-network-v1.js
          if grep -q "PACK L/R MUST BE OFF FOR ENGINE START" engine/integration/isn-apu-start-chain-v1.js; then exit 1; fi
