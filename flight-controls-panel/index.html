<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>B737 Classic — Flight Controls Panel</title>
  <link rel="stylesheet" href="flight-controls.css?v=TGL-0006-NO-HALO">
</head>
<body>
  <main class="sim" aria-label="Boeing 737 Classic flight controls panel simulator">
    <section class="panel-wrap" aria-label="Interactive panel">
      <div class="panel" id="panel">
        <img class="panel-art" src="assets/flight-controls-front-empty-v1.webp" alt="Boeing 737 Classic flight controls and navigation transfer panel, straight-on view" draggable="false">

        <button class="ann" data-light="standbyQuantity" style="--x:66.2%;--y:6.65%;--w:17.1%;--h:3.95%" aria-label="Standby hydraulic low quantity light"><span>LOW<br>QUANTITY</span></button>
        <button class="ann" data-light="standbyPressure" style="--x:66.2%;--y:11.05%;--w:17.1%;--h:3.95%" aria-label="Standby hydraulic low pressure light"><span>LOW<br>PRESSURE</span></button>
        <button class="ann" data-light="flightPressureA" style="--x:14.2%;--y:24.85%;--w:16.8%;--h:3.75%" aria-label="Flight control A low pressure light"><span>LOW<br>PRESSURE</span></button>
        <button class="ann" data-light="flightPressureB" style="--x:32.25%;--y:24.85%;--w:16.8%;--h:3.75%" aria-label="Flight control B low pressure light"><span>LOW<br>PRESSURE</span></button>
        <button class="ann" data-light="feelDiff" style="--x:62.6%;--y:43.35%;--w:17.2%;--h:3.55%" aria-label="Feel differential pressure light"><span>FEEL<br>DIFF PRESS</span></button>
        <button class="ann" data-light="speedTrim" style="--x:62.6%;--y:47.65%;--w:17.2%;--h:3.55%" aria-label="Speed trim fail light"><span>SPEED TRIM<br>FAIL</span></button>
        <button class="ann" data-light="machTrim" style="--x:62.6%;--y:51.95%;--w:17.2%;--h:3.55%" aria-label="Mach trim fail light"><span>MACH TRIM<br>FAIL</span></button>
        <button class="ann" data-light="autoSlat" style="--x:62.6%;--y:56.25%;--w:17.2%;--h:3.55%" aria-label="Auto slat fail light"><span>AUTO SLAT<br>FAIL</span></button>
        <button class="ann" data-light="yawDamper" style="--x:22.6%;--y:56.35%;--w:17.2%;--h:4.05%" aria-label="Yaw damper light"><span>YAW<br>DAMPER</span></button>

        <button class="paddle-control three" data-control="flightA" data-position="on" style="--x:15.7%;--y:8.15%;--w:11.2%;--h:13.05%" aria-label="Flight control A switch" aria-valuetext="ON"><i></i></button>
        <button class="paddle-guard" data-guard-control="flightA" data-guard="closed" style="--x:15.7%;--y:8.15%;--w:11.2%;--h:13.05%" aria-label="flightA safety guard, closed" aria-pressed="false"><i class="hinge"></i><i class="guard-plate"></i></button>
        <button class="paddle-control three" data-control="flightB" data-position="on" style="--x:36.8%;--y:8.15%;--w:11.2%;--h:13.05%" aria-label="Flight control B switch" aria-valuetext="ON"><i></i></button>
        <button class="paddle-guard" data-guard-control="flightB" data-guard="closed" style="--x:36.8%;--y:8.15%;--w:11.2%;--h:13.05%" aria-label="flightB safety guard, closed" aria-pressed="false"><i class="hinge"></i><i class="guard-plate"></i></button>
        <button class="paddle-control two" data-control="spoilerA" data-position="on" style="--x:18.2%;--y:36.3%;--w:12.2%;--h:14.35%" aria-label="Spoiler A switch" aria-valuetext="ON"><i></i></button>
        <button class="paddle-guard" data-guard-control="spoilerA" data-guard="closed" style="--x:18.2%;--y:36.3%;--w:12.2%;--h:14.35%" aria-label="spoilerA safety guard, closed" aria-pressed="false"><i class="hinge"></i><i class="guard-plate"></i></button>
        <button class="paddle-control two" data-control="spoilerB" data-position="on" style="--x:34.1%;--y:36.3%;--w:12.2%;--h:14.35%" aria-label="Spoiler B switch" aria-valuetext="ON"><i></i></button>
        <button class="paddle-guard" data-guard-control="spoilerB" data-guard="closed" style="--x:34.1%;--y:36.3%;--w:12.2%;--h:14.35%" aria-label="spoilerB safety guard, closed" aria-pressed="false"><i class="hinge"></i><i class="guard-plate"></i></button>

        <div class="alt-arm" data-guard="closed" data-armed="false" style="--x:54.6%;--y:22.05%;--w:14.1%;--h:17.2%">
          <button class="arm-switch" aria-label="Alternate flaps arm switch" aria-pressed="false">
            <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false">
          </button>
          <button class="red-guard" aria-label="Alternate flaps red guard, closed" aria-pressed="false"><i></i></button>
        </div>

        <button class="toggle two-pos" data-control="altPosition" data-position="off" style="--x:77.0%;--y:28.65%;--w:15.7%;--h:8.2%" aria-label="Alternate flaps position switch" aria-valuetext="OFF">
          <img class="frame frame-off" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false">
          <img class="frame frame-center" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false">
          <img class="frame frame-on" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false">
        </button>
        <button class="toggle two-pos" data-control="yawDamper" data-position="on" style="--x:22.7%;--y:61.3%;--w:16.0%;--h:8.0%" aria-label="Yaw damper switch" aria-valuetext="ON">
          <img class="frame frame-off" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false">
          <img class="frame frame-center" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false">
          <img class="frame frame-on" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false">
        </button>

        <button class="toggle selector" data-control="vhfNav" data-position="normal" style="--x:23.5%;--y:74.7%;--w:13.0%;--h:6.6%" aria-label="VHF navigation transfer switch" aria-valuetext="NORMAL">
          <img class="nav-frame nav-left" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false" aria-hidden="true">
          <img class="nav-frame nav-center" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false" aria-hidden="true">
          <img class="nav-frame nav-right" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false" aria-hidden="true">
        </button>
        <button class="toggle selector" data-control="irs" data-position="normal" style="--x:65.5%;--y:74.7%;--w:13.0%;--h:6.6%" aria-label="IRS transfer switch" aria-valuetext="NORMAL">
          <img class="nav-frame nav-left" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false" aria-hidden="true">
          <img class="nav-frame nav-center" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false" aria-hidden="true">
          <img class="nav-frame nav-right" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false" aria-hidden="true">
        </button>
        <button class="toggle selector" data-control="efi" data-position="normal" style="--x:25.1%;--y:86.2%;--w:13.0%;--h:6.6%" aria-label="EFI transfer switch" aria-valuetext="NORMAL">
          <img class="nav-frame nav-left" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false" aria-hidden="true">
          <img class="nav-frame nav-center" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false" aria-hidden="true">
          <img class="nav-frame nav-right" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" draggable="false" aria-hidden="true">
        </button>
      </div>
    </section>

    <section class="test-rack" aria-label="Simulation test controls">
      <button id="power" aria-pressed="true">POWER</button>
      <button id="lamp-test">HOLD LAMP TEST</button>
      <button id="hyd-fail" aria-pressed="false">STBY HYD FAIL</button>
      <button id="reset">RESET</button>
      <output id="status" aria-live="polite">READY — NORMAL CONFIGURATION</output>
      <p>Educational systems/animation prototype — not for aircraft operation.</p>
    </section>
  </main>
  <script src="fcom-control-mechanics.js"></script>
  <script src="flight-controls.js"></script>
</body>
</html>
