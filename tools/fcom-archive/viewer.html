<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B737 FCOM — Offline Archive</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#111b27;color:#eef3f8}header{display:flex;gap:12px;align-items:center;padding:15px 22px;border-bottom:1px solid #455468;flex-wrap:wrap}strong{font-size:18px}small{color:#99aabd}input,button{border:1px solid #405b70;border-radius:7px;background:#1b3043;color:#fff;padding:10px}button{cursor:pointer}button:hover{background:#2b516a}main{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 69px)}aside{padding:16px;border-left:1px solid #405b70;overflow-y:auto;max-height:calc(100vh - 69px)}#results{display:grid;gap:6px;max-height:70vh;overflow:auto}#results button{text-align:right;white-space:normal}article{padding:15px;overflow:auto;height:calc(100vh - 69px)}#viewer{display:grid;grid-template-columns:50% 50%;gap:10px}#image{width:100%;height:auto;max-height:76vh;object-fit:contain;object-position:top;display:block;background:#fff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#192b3b;border:1px solid #41546a;border-radius:8px;padding:13px;direction:ltr;text-align:left;line-height:1.55;font-family:Consolas,monospace}#tables a,#figures a{color:#7ac9ff}#meta{color:#cbd7de;margin-bottom:8px}@media(max-width:900px){main{grid-template-columns:1fr}aside,article{height:auto;max-height:none}#viewer{grid-template-columns:1fr}}
</style></head><body><header><strong>B737 Classic — FCOM Archive</strong><small id="status">در حال خواندن آرشیو محلی…</small><div style="flex:1"></div><button id="back">صفحهٔ قبل</button><input id="page" aria-label="PDF page" type="number" min="1" value="1" style="width:80px"><button id="goto">برو</button><button id="forward">صفحهٔ بعد</button></header>
<main><aside><label>جست‌وجو در متن FCOM</label><div style="display:flex;gap:5px;margin:8px 0"><input id="query" placeholder="Autothrottle / IRS" style="min-width:0;width:100%"><button id="search">جست‌وجو</button></div><div id="results"></div></aside><article><div id="meta"></div><div id="viewer"><div><img id="image" alt="تصویر کامل صفحه"></div><div><div id="tables"></div><div id="figures"></div><pre id="text" dir="ltr"></pre></div></div></article></main>
<script>
let max=1;const $=id=>document.getElementById(id);
async function page(n){n=Math.max(1,Math.min(max,Number(n)||1));$('page').value=n;const r=await fetch('/api/page?n='+n),j=await r.json();if(j.error){$('meta').textContent=j.error;return;}$('meta').textContent=`PDF page ${n} / ${max} · Printed folio candidates: ${(j.printed_folio_candidates||[]).join(', ')}`;$('image').src=j.page_image?'/'+j.page_image:'';$('text').textContent=j.text||'[این صفحه متن قابل‌انتخاب ندارد؛ به تصویر سمت راست مراجعه کن.]';$('tables').replaceChildren();for(const t of j.tables||[]){let a=document.createElement('a');a.href='/'+t.csv;a.textContent=`Table ${t.number} CSV · `;a.target='_blank';$('tables').append(a);let b=document.createElement('a');b.href='/'+t.visual_crop;b.textContent='Original table crop';b.target='_blank';$('tables').append(b);$('tables').append(document.createElement('br'))}$('figures').replaceChildren();for(const f of j.figures||[]){if(!f.filename)continue;let a=document.createElement('a');a.href='/'+f.filename;a.textContent='Embedded figure · ';a.target='_blank';$('figures').append(a)}}
async function search(){let q=$('query').value.trim();if(!q)return;let r=await fetch('/api/search?q='+encodeURIComponent(q)),j=await r.json();$('results').replaceChildren();if(j.error){$('results').textContent=j.error;return}for(const it of j.items||[]){let b=document.createElement('button');b.textContent=`صفحه ${it.page}: ${it.snippet.replace(/<[^>]*>/g,'')}`;b.onclick=()=>page(it.page);$('results').append(b)}if(!(j.items||[]).length)$('results').textContent='نتیجه‌ای پیدا نشد'}
$('search').onclick=search;$('query').onkeydown=e=>{if(e.key==='Enter')search()};$('goto').onclick=()=>page($('page').value);$('back').onclick=()=>page(Number($('page').value)-1);$('forward').onclick=()=>page(Number($('page').value)+1);
fetch('/manifest.json').then(x=>x.json()).then(m=>{max=m.source_pdf_pages;$('page').max=max;$('status').textContent=`${m.pages_exported} / ${max} pages • ${m.full_document_complete?'کامل':'در حال تکمیل'}`;page(1)}).catch(e=>$('status').textContent=String(e));
</script></body></html>
