<svg xmlns="http://www.w3.org/2000/svg" width="270" height="600" viewBox="0 0 270 600" preserveAspectRatio="none" role="img" aria-label="OH14 NOT ARMED illuminated glass within original photographic bezel">
 <defs>
  <linearGradient id="glass" x1="0" y1="0" x2=".06" y2="1">
   <stop offset="0" stop-color="#110e0b"/>
   <stop offset=".18" stop-color="#070808"/>
   <stop offset=".72" stop-color="#0a0908"/>
   <stop offset="1" stop-color="#17110e"/>
  </linearGradient>
  <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#b8b1a1" stop-opacity=".085"/>
   <stop offset=".24" stop-color="#b8b1a1" stop-opacity=".007"/>
   <stop offset=".8" stop-color="#af9f81" stop-opacity="0"/>
   <stop offset="1" stop-color="#af9f81" stop-opacity=".025"/>
  </linearGradient>
  <filter id="softLight" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
 </defs>
 <!-- Only the black interior glass, NEVER the metallic frame or mounting holes. -->
 <rect x="27" y="29" width="216" height="542" rx="4" fill="url(#glass)"/>
 <rect x="30" y="32" width="210" height="536" rx="3" fill="url(#reflection)"/>
 <g font-family="Liberation Sans Narrow,Arial Narrow,Arial,sans-serif" font-stretch="condensed"
    font-size="75" font-weight="700" text-anchor="middle" letter-spacing="1"
    fill="#fb8f2c" opacity=".70"
    filter="url(#softLight)"><text x="185" y="146">A</text><text x="85" y="233">N</text><text x="185" y="233">R</text><text x="85" y="320">O</text><text x="185" y="320">M</text><text x="85" y="407">T</text><text x="185" y="407">E</text><text x="185" y="494">D</text></g>
 <g font-family="Liberation Sans Narrow,Arial Narrow,Arial,sans-serif" font-stretch="condensed"
    font-size="75" font-weight="700" text-anchor="middle" letter-spacing="1"
    fill="#ffb763" opacity=".97"><text x="185" y="146">A</text><text x="85" y="233">N</text><text x="185" y="233">R</text><text x="85" y="320">O</text><text x="185" y="320">M</text><text x="85" y="407">T</text><text x="185" y="407">E</text><text x="185" y="494">D</text></g>
</svg>