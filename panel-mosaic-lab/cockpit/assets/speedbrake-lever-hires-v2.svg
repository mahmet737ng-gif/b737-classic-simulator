<svg xmlns="http://www.w3.org/2000/svg" width="480" height="828" viewBox="0 0 120 207" aria-label="Boeing 737 Classic SPD BRK lever, photorealistic vector">
<defs>
 <linearGradient id="alloy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#555a5c"/><stop offset=".09" stop-color="#9da3a7"/><stop offset=".27" stop-color="#e8eaeb"/><stop offset=".54" stop-color="#949da3"/><stop offset=".78" stop-color="#6e767a"/><stop offset="1" stop-color="#353a3d"/></linearGradient>
 <linearGradient id="armEdge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3a4247"/><stop offset=".13" stop-color="#bfc6c8"/><stop offset=".6" stop-color="#f0efeb"/><stop offset="1" stop-color="#4b5459"/></linearGradient>
 <linearGradient id="ivory" x1=".06" y1="0" x2=".95" y2="1"><stop stop-color="#b5ada0"/><stop offset=".12" stop-color="#f8f3e6"/><stop offset=".38" stop-color="#e6e0ce"/><stop offset=".69" stop-color="#c9c4b6"/><stop offset=".87" stop-color="#aaa498"/><stop offset="1" stop-color="#dedacb"/></linearGradient>
 <linearGradient id="handleGloss" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fffdf0" stop-opacity=".7"/><stop offset=".18" stop-color="#fffdf0" stop-opacity=".12"/><stop offset=".7" stop-color="#60615c" stop-opacity=".12"/><stop offset="1" stop-color="#6c6a64" stop-opacity=".3"/></linearGradient>
 <radialGradient id="pivot" cx=".34" cy=".28" r=".75"><stop stop-color="#f0f0ed"/><stop offset=".35" stop-color="#969da1"/><stop offset=".68" stop-color="#4e565c"/><stop offset=".95" stop-color="#c1c6c7"/><stop offset="1" stop-color="#33383c"/></radialGradient>
 <filter id="shadow" x="-40%" y="-35%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.0"/></filter>
 <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".32" numOctaves="2" seed="13" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer></filter>
</defs>
<!-- Discrete shadow: a mounted thin stamped-steel control rather than a floating handle. -->
<path d="M83 77 L99 101 Q104 110 105 124 L112 177 L115 190 L105 198 L94 191 L92 130 L75 99 Z" fill="#000" opacity=".27" filter="url(#shadow)"/>
<!-- One-piece 3-D bent lever arm, polished edge and dark split on its side. -->
<path d="M76 70 L88 70 L99 98 L107 118 L108 169 L111 194 Q106 200 97 198 L92 193 L94 132 Q92 122 84 111 L70 91 Z" fill="url(#alloy)" stroke="#444d52" stroke-width="1.0" stroke-linejoin="round"/>
<path d="M83 83 L91 81 L101 105 Q103 112 102 121 L102 181 L99 188 L98 133 Q97 122 91 114 Z" fill="url(#armEdge)" opacity=".84"/>
<path d="M91 115 L96 126 L97 180" stroke="#eef0ec" stroke-opacity=".75" stroke-width="1.3" fill="none"/>
<path d="M107 125 L109 172" stroke="#353c41" stroke-width="1.4" opacity=".72"/>
<path d="M96 194 L99 205 L107 204 L111 190" fill="#596369" stroke="#30383c" stroke-width="1"/>
<!-- Metal pivot exactly at 102,181; the software aligns THIS POINT to each stencil. -->
<ellipse cx="103" cy="182" rx="11" ry="12.5" fill="#13191d" opacity=".35"/>
<ellipse cx="102" cy="181" rx="9.2" ry="10.8" fill="url(#pivot)" stroke="#373f43" stroke-width=".9"/>
<ellipse cx="102" cy="181" rx="4.5" ry="5.0" fill="#50585e" stroke="#aab1b3" stroke-width=".7"/>
<path d="M99.4 182.9 L104.5 179.4" stroke="#262b30" stroke-width="1" stroke-linecap="round"/>
<!-- Ivory elongated handgrip, photographed style and authentic side screw. -->
<g transform="rotate(-35 67 52)">
 <rect x="47" y="10.8" width="39" height="87" rx="15" fill="#171819" opacity=".3" filter="url(#shadow)"/>
 <rect x="46.8" y="10" width="39" height="86.5" rx="15" fill="url(#ivory)" stroke="#958f83" stroke-width="1.2"/>
 <rect x="48.5" y="12" width="35.5" height="82.5" rx="13.8" fill="url(#handleGloss)" opacity=".8"/>
 <path d="M54 16 Q51.5 35 52.5 79" fill="none" stroke="#fffdf3" opacity=".55" stroke-width="1.2"/>
 <path d="M82 22 Q84 49 81 77" fill="none" stroke="#8c897f" opacity=".37" stroke-width="1.5"/>
 <circle cx="51" cy="82.5" r="4.5" fill="#777c7e" stroke="#484d50" stroke-width="1"/>
 <circle cx="51" cy="82.5" r="2.3" fill="#3a3f43" stroke="#b7bbb9" stroke-width=".7"/>
 <path d="M49.5 83.9 L52.7 81.0" stroke="#dde0dc" stroke-width=".65"/>
 <text x="66.8" y="40.5" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" font-size="12" letter-spacing=".4" fill="#171717">SPD</text>
 <text x="66.8" y="56" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" font-size="12" letter-spacing=".4" fill="#171717">BRK</text>
 <rect x="47" y="11" width="38.5" height="85" rx="15" fill="#777" filter="url(#grain)" opacity=".22"/>
</g>
</svg>
