<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>B737 Classic — Fuel Panel</title>
  <link rel="stylesheet" href="fuel-panel.css?v=TGL-NEWREF-0002">
</head>
<body>
  <main class="app-shell">
    <section class="panel-wrap" aria-label="Boeing 737 Classic fuel panel simulator">
      <div id="panel" class="panel" data-powered="true">
        <img class="panel-photo" src="assets/fuel-panel-front-v3-empty-switches.png" alt="Boeing 737 Classic fuel panel, orthographic front view" draggable="false">

        <div id="fuel-temp-control" class="fuel-temp-control" role="slider" tabindex="0" aria-label="Fuel temperature" aria-valuemin="-40" aria-valuemax="40" aria-valuenow="10" aria-valuetext="10 degrees Celsius">
          <div id="fuel-temp-needle" class="fuel-temp-needle" aria-hidden="true"></div>
        </div>

        <div class="lamp blue" id="lamp-fuel-valve-1" style="--x:13.04%;--y:3.09%;--w:16.21%;--h:4.50%" role="button" tabindex="0" aria-label="Engine 1 fuel valve closed light"><span>FUEL VALVE<br>CLOSED</span></div>
        <div class="lamp blue" id="lamp-fuel-valve-2" style="--x:69.17%;--y:3.09%;--w:14.82%;--h:4.50%" role="button" tabindex="0" aria-label="Engine 2 fuel valve closed light"><span>FUEL VALVE<br>CLOSED</span></div>
        <div class="lamp amber bright" id="lamp-filter-1" style="--x:12.94%;--y:26.64%;--w:16.70%;--h:4.70%" role="button" tabindex="0" aria-label="Engine 1 filter bypass light"><span>FILTER<br>BY PASS</span></div>
        <div class="lamp blue" id="lamp-crossfeed" style="--x:41.21%;--y:26.64%;--w:16.01%;--h:4.70%" aria-label="Crossfeed valve open light"><span>VALVE<br>OPEN</span></div>
        <div class="lamp amber bright" id="lamp-filter-2" style="--x:69.76%;--y:26.64%;--w:16.40%;--h:4.70%" role="button" tabindex="0" aria-label="Engine 2 filter bypass light"><span>FILTER<br>BY PASS</span></div>

        <div class="lamp amber pump-lamp bright" data-pump="ctrL" style="--x:32.31%;--y:46.98%;--w:16.01%;--h:4.70%"><span>LOW<br>PRESSURE</span></div>
        <div class="lamp amber pump-lamp bright" data-pump="ctrR" style="--x:50.10%;--y:46.98%;--w:16.01%;--h:4.70%"><span>LOW<br>PRESSURE</span></div>
        <div class="lamp amber pump-lamp bright" data-pump="tank1Aft" style="--x:9.78%;--y:68.85%;--w:16.31%;--h:4.76%"><span>LOW<br>PRESSURE</span></div>
        <div class="lamp amber pump-lamp bright" data-pump="tank1Fwd" style="--x:27.87%;--y:68.85%;--w:15.81%;--h:4.76%"><span>LOW<br>PRESSURE</span></div>
        <div class="lamp amber pump-lamp bright" data-pump="tank2Fwd" style="--x:55.43%;--y:68.85%;--w:16.11%;--h:4.76%"><span>LOW<br>PRESSURE</span></div>
        <div class="lamp amber pump-lamp bright" data-pump="tank2Aft" style="--x:73.42%;--y:68.85%;--w:16.31%;--h:4.76%"><span>LOW<br>PRESSURE</span></div>

        <div class="toggle-visual" data-switch="ctrL" style="--left:33.3%;--top:55.7%"></div>
        <div class="toggle-visual" data-switch="ctrR" style="--left:51.3%;--top:55.7%"></div>
        <div class="toggle-visual" data-switch="tank1Aft" style="--left:10.7%;--top:76.9%"></div>
        <div class="toggle-visual" data-switch="tank1Fwd" style="--left:28.7%;--top:76.9%"></div>
        <div class="toggle-visual" data-switch="tank2Fwd" style="--left:57.1%;--top:76.9%"></div>
        <div class="toggle-visual" data-switch="tank2Aft" style="--left:74.1%;--top:76.9%"></div>

        <svg class="control-layer" viewBox="0 0 1012 1554" aria-label="Fuel panel controls">
          <defs>
            <clipPath id="clip-crossfeed"><path d="M440 504 C407 511 385 552 385 603 C385 658 408 694 448 705 L524 705 C565 692 586 653 586 601 C586 550 566 512 532 503 Z"/></clipPath>
            <clipPath id="clip-ctrL"><path d="M352 870 C326 884 330 922 356 937 C366 942 377 944 388 943 L396 970 C399 981 416 983 421 970 L424 944 C453 932 456 892 431 876 C409 862 374 860 352 870 Z"/></clipPath>
            <clipPath id="clip-ctrR"><path d="M538 870 C511 885 514 925 541 939 C551 944 561 946 572 944 L580 971 C584 981 600 982 605 970 L608 943 C636 929 638 890 613 875 C591 862 560 861 538 870 Z"/></clipPath>
            <clipPath id="clip-tank1Aft"><path d="M116 1229 C89 1246 96 1289 125 1300 C135 1304 146 1305 157 1303 L169 1330 C174 1341 191 1339 194 1327 L194 1299 C220 1284 217 1245 190 1232 C168 1221 137 1218 116 1229 Z"/></clipPath>
            <clipPath id="clip-tank1Fwd"><path d="M289 1229 C262 1245 268 1287 296 1300 C307 1305 318 1306 329 1304 L341 1331 C346 1341 362 1340 366 1328 L367 1299 C393 1284 391 1246 365 1232 C344 1221 310 1219 289 1229 Z"/></clipPath>
            <clipPath id="clip-tank2Fwd"><path d="M570 1229 C543 1245 549 1288 578 1300 C588 1305 599 1306 610 1304 L622 1331 C627 1341 643 1340 647 1328 L648 1299 C674 1284 672 1246 646 1232 C624 1221 591 1219 570 1229 Z"/></clipPath>
            <clipPath id="clip-tank2Aft"><path d="M746 1229 C719 1245 725 1288 754 1300 C764 1305 775 1306 786 1304 L798 1331 C803 1341 819 1340 823 1328 L824 1299 C850 1284 848 1246 822 1232 C800 1221 767 1219 746 1229 Z"/></clipPath>
          </defs>

          <g class="control rotary" data-control="crossfeed" role="button" tabindex="0" aria-label="Crossfeed selector, closed">
            <g class="sprite rotary-sprite" style="transform-origin:486px 604px"><image href="assets/fuel-panel-front-v3-empty-switches.png" x="0" y="0" width="1012" height="1554" clip-path="url(#clip-crossfeed)"/></g>
            <path class="hit" d="M440 504 C407 511 385 552 385 603 C385 658 408 694 448 705 L524 705 C565 692 586 653 586 601 C586 550 566 512 532 503 Z"/>
          </g>

          <g class="control toggle" data-control="ctrL" style="--ox:405px;--oy:966px" role="switch" aria-checked="false" tabindex="0" aria-label="Center left fuel pump">
            <path class="hit" d="M352 870 C326 884 330 922 356 937 C366 942 377 944 388 943 L396 970 C399 981 416 983 421 970 L424 944 C453 932 456 892 431 876 C409 862 374 860 352 870 Z"/>
          </g>
          <g class="control toggle" data-control="ctrR" style="--ox:592px;--oy:968px" role="switch" aria-checked="false" tabindex="0" aria-label="Center right fuel pump">
            <path class="hit" d="M538 870 C511 885 514 925 541 939 C551 944 561 946 572 944 L580 971 C584 981 600 982 605 970 L608 943 C636 929 638 890 613 875 C591 862 560 861 538 870 Z"/>
          </g>
          <g class="control toggle" data-control="tank1Aft" style="--ox:181px;--oy:1326px" role="switch" aria-checked="false" tabindex="0" aria-label="Tank 1 aft fuel pump">
            <path class="hit" d="M116 1229 C89 1246 96 1289 125 1300 C135 1304 146 1305 157 1303 L169 1330 C174 1341 191 1339 194 1327 L194 1299 C220 1284 217 1245 190 1232 C168 1221 137 1218 116 1229 Z"/>
          </g>
          <g class="control toggle" data-control="tank1Fwd" style="--ox:354px;--oy:1327px" role="switch" aria-checked="false" tabindex="0" aria-label="Tank 1 forward fuel pump">
            <path class="hit" d="M289 1229 C262 1245 268 1287 296 1300 C307 1305 318 1306 329 1304 L341 1331 C346 1341 362 1340 366 1328 L367 1299 C393 1284 391 1246 365 1232 C344 1221 310 1219 289 1229 Z"/>
          </g>
          <g class="control toggle" data-control="tank2Fwd" style="--ox:635px;--oy:1327px" role="switch" aria-checked="false" tabindex="0" aria-label="Tank 2 forward fuel pump">
            <path class="hit" d="M570 1229 C543 1245 549 1288 578 1300 C588 1305 599 1306 610 1304 L622 1331 C627 1341 643 1340 647 1328 L648 1299 C674 1284 672 1246 646 1232 C624 1221 591 1219 570 1229 Z"/>
          </g>
          <g class="control toggle" data-control="tank2Aft" style="--ox:811px;--oy:1327px" role="switch" aria-checked="false" tabindex="0" aria-label="Tank 2 aft fuel pump">
            <path class="hit" d="M746 1229 C719 1245 725 1288 754 1300 C764 1305 775 1306 786 1304 L798 1331 C803 1341 819 1340 823 1328 L824 1299 C850 1284 848 1246 822 1232 C800 1221 767 1219 746 1229 Z"/>
          </g>
        </svg>

        <div id="focus-label" class="focus-label" aria-live="polite"></div>
      </div>
    </section>

    <section class="test-rack" aria-label="Simulation test controls">
      <button id="power" class="rack-button active" type="button">POWER</button>
      <button id="lamp-test" class="rack-button" type="button">HOLD LAMP TEST</button>
      <button id="reset" class="rack-button" type="button">RESET</button>
      <output id="status">READY — ALL PUMPS OFF</output>
    </section>
  </main>
  <script src="fuel-panel.js"></script>
</body>
</html>
